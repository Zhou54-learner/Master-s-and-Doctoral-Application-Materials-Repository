      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"line-height: 28px;text-wrap: wrap;margin: 0px;text-align: justify\"><span style=\"font-family: Arial, sans-serif\">TAILIN WU is born in 1989 in China. He received his Bachelor of Science degree from the School of Physics at Peking University in 2012. In 2019, he received his Ph.D in Physics degree from the Massachusetts Institute of Technology. His Ph.D. thesis focused on the theme of AI for Physics and Physics for AI. From 2020 to 2023, he conducted postdoctoral research in the Computer Science Department at Stanford University. He joined the School of Engineering at Westlake University full-time in the summer of 2023 and establish the AI for Scientific Simulation and Discovery Lab.<\/span><\/p><div><span style=\"font-family: Arial, sans-serif\"><br\/><\/span><\/div><p><br\/><\/p><\/div>",

      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>2023<\/p><p>Assistant Professor, School of Engineering, Westlake University<\/p><p>2020<\/p><p>Postdoctoral Researcher, Computer Science Department, Stanford University<\/p><p>2019<\/p><p>Ph.D. degree, Massachusetts Institute of Technology (MIT)<\/p><p>2012<\/p><p>Bachelor&#39;s degree, Peking University<\/p><\/div>",
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"line-height: 28px;text-wrap: wrap;margin: 0px;text-align: justify\"><span style=\"font-family: Arial, sans-serif\">Dr. Tailin Wu&#39;s research focuses on the core and universal problems at the intersection of AI and scientific disciplines, including (1) development of machine learning methods for large-scale scientific simulations and scientific design (for fluid dynamics, mechanical engineering, materials science, life sciences), (2) development of machine learning methods for scientific discovery (for physics, life sciences), and (3) representation learning based on graph neural networks and information theory. Particularly noteworthy is that during his Ph.D. and postdoctoral work, Dr. Wu Tailin proposed a series of algorithms centered around deep learning surrogate models for scientific simulations, significantly accelerating simulation speeds by orders of magnitude in fields such as fluid mechanics and plasma physics, and addressing the core challenges of multi-scale, multi-resolution, and large-scale problems. To promote scientific discovery, he was the first to propose a series of algorithms centered around AI Physicist, capable of mimicking scientists&#39; discovery of simple, universal physical laws and internal structures of systems. In the area of representation learning, Tailin&#39;s Graph Information Bottleneck significantly improved the robustness of graph representation learning.<\/span><\/p><p style=\"line-height: 28px;text-wrap: wrap;margin: 0px;text-align: justify\"><span style=\"font-family: Arial, sans-serif\"><br\/><\/span><\/p><p style=\"line-height: 28px;text-wrap: wrap;text-align: justify\"><span style=\"font-family: Arial, sans-serif\">Tailin Wu&#39;s work is being used in large-scale simulations of fluids and materials, as well as in scientific discoveries in the fields of physics and astronomy. His work has been published in top machine learning conferences such as NeurIPS, ICLR, UAI, and leading physics journals such as Physical Review E, and has been covered by MIT Technology Review, among others. Dr. Tailin Wu also serves as a reviewer for international journals such as Proceedings of the National Academy of Sciences (PNAS), Nature Communications, Nature Machine Intelligence, Science Advances, and top machine learning conferences.<\/span><\/p><div><span style=\"font-family: Arial, sans-serif\"><br\/><\/span><\/div><p><br\/><\/p><\/div>",

          title: "Contact Us",
          content: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"text-wrap: wrap\"><span style=\"font-family: Times\">Email: <\/span><a href=\"mailto:wutailin@westlake.edu.cn\"><strong><span style=\"font-family: Times\">wutailin@westlake.edu.cn<\/span><\/strong><\/a><\/p><p style=\"text-wrap: wrap;text-align: justify\"><span style=\"font-family: Times\">Our research group carries out long-term work on core and universal problems at the intersection of AI + Science. Our main research directions include: (1) Developing machine learning algorithms (based on Graph Neural Networks and Diffusion Models) for large-scale, multi-scale scientific simulation (applied to fluid dynamics, materials, plasmas) and scientific design (protein design, materials design, mechanical design); (2) Developing machine learning algorithms (based on neuro-symbolic AI and foundation models) to discover universal rules and internal structures in scientific systems (applied to life sciences and physics); (3) Developing representation learning algorithms with high generalizability and robustness. For more information, please visit <\/span><a href=\"https:\/\/tailin.org\/\" style=\"color: rgb(0, 112, 192);\"><span style=\"color: rgb(0, 112, 192);\"><strong><span style=\"font-family: Times; color: rgb(0, 112, 192);\">https:\/\/tailin.org<\/span><\/strong><\/span><strong><span style=\"font-family: Times\">\/<\/span><\/strong><\/a><strong><span style=\"font-family: Times\">.<\/span><\/strong><\/p><p style=\"text-wrap: wrap;text-align: justify\"><span style=\"font-family: Times\">We are currently hiring students with strong backgrounds in machine learning or natural sciences who have a keen interest in the above research directions. Positions available include postdoctoral fellows, doctoral students (see <\/span><a href=\"https:\/\/en.westlake.edu.cn\/admissions\/graduate\/\" target=\"_self\" needdownload=\"false\" data-needdownload=\"false\" data-needparse=\"false\" style=\"color: rgb(11, 119, 205);\"><span style=\"color: rgb(0, 112, 192);\"><strong><span style=\"font-family: Times; color: rgb(0, 112, 192);\">enrollment information<\/span><\/strong><\/span><\/a><span style=\"font-family: Times\">), research assistants (2 years), and interns (minimum 3 months). Please refer to our <\/span><a href=\"https:\/\/cloud.tencent.com\/developer\/article\/2289981?areaSource=&traceId=\" style=\"color: rgb(0, 112, 192);\"><span style=\"color: rgb(0, 112, 192);\"><strong><span style=\"font-family: Times; color: rgb(0, 112, 192);\">recruitment article<\/span><\/strong><\/span><\/a><span style=\"font-family: Times\"> for details.<\/span><\/p><p style=\"text-wrap: wrap;text-align: justify\"><span style=\"font-family: Times\">Please send your CV to: <\/span><a href=\"mailto:wutailin@westlake.edu.cn\"><strong><span style=\"font-family: Times\">wutailin@westlake.edu.cn<\/span><\/strong><\/a><span style=\"font-family: Times\">. We look forward to your joining! Together, we solve important AI + Science problems at Westlake University!<\/span><\/p><p style=\"text-wrap: wrap;text-align: justify\"><br\/><\/p><p style=\"text-wrap: wrap;text-align: center\"><span style=\"font-family: Times\"><img src=\".\/W020240402637970498715_ORIGIN.jpg\" data-uploadpic=\"W020230921574449488440.jpg\" needdownload=\"true\" data-needdownload=\"true\" title=\"吴泰霖实验室.jpg\" alt=\"\" uploadpic=\"W020240402637970498715_ORIGIN.jpg\" style=\"width: 700px;\" picname=\"吴泰霖实验室.jpg\" OLDSRC=\"W020240402637970498715_ORIGIN.jpg\" \/><\/span><\/p><p style=\"text-wrap: wrap;text-align: center\"><span style=\"font-family: Times\">Tailin Wu and his group members<\/span><\/p><p><br\/><\/p><\/div>",
