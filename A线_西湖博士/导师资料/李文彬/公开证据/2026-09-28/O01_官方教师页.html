      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin: 0px; text-align: justify; line-height: 28px;\">Wenbin Li received his bachelor’s degree from Zhejiang University (2008), master’s degree from the University of Pennsylvania (2011), and Ph.D. degree from the Massachusetts Institute of Technology (MIT, 2015), all in Materials Science and Engineering. From 2015 to 2017, he was a postdoctoral associate at the Research Laboratory of Electronics of MIT. He then spent two years at the University of Oxford as a Marie Curie Fellow. In 2019, he joined the School of Engineering at Westlake University as an Assistant Professor and is now the Principal Investigator of the Materials Modeling and Design Lab. He has received a number of awards, including the R&amp;D 100 Award (team member, 2016), the Marie Skłodowska-Curie Individual Fellowship (2017), the Junior Research Fellowship of Wolfson College at the University of Oxford (2017), and the Excellence in Teaching Award from the School of Engineering at Westlake University (2022).<\/p><\/div>",

      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin: 0px; text-align: justify; line-height: 1.75em; font-size: 16px;\"><span data-index=\"9\" style=\"font-family: arial, helvetica, sans-serif; font-size: 16px;\">The research of our group focuses on the fundamental understanding and design of advanced functional materials using computational and data-driven approaches. By employing quantum mechanical calculations, atomistic simulations, and machine learning, we aim to provide fundamental insights into structure-property relationships in complex functional materials, as well as accelerate the discovery of new materials through computational and machine learning-assisted design. <\/span><\/p><p style=\"margin: 0px; text-align: justify; line-height: 1.75em; font-size: 16px;\"><span data-index=\"9\" style=\"font-family: arial, helvetica, sans-serif; font-size: 16px;\"> <\/span><\/p><p style=\"margin: 0px; text-align: justify; line-height: 1.75em; font-size: 16px;\"><span data-index=\"9\" style=\"font-family: arial, helvetica, sans-serif; font-size: 16px;\">Our main research interests include:<\/span><\/p><p style=\"margin: 0px 0px 0px 34px; text-align: justify; text-indent: -34px; line-height: 1.75em; font-size: 16px;\"><span data-index=\"9\" style=\"font-family: arial, helvetica, sans-serif; font-size: 16px;\">(1) Electron-phonon interactions in complex electronic materials<\/span><\/p><p style=\"margin: 0px 0px 0px 34px; text-align: justify; text-indent: -34px; line-height: 1.75em; font-size: 16px;\"><span data-index=\"9\" style=\"font-family: arial, helvetica, sans-serif; font-size: 16px;\">(2) Modeling and design of advanced semiconductors<\/span><\/p><p style=\"margin: 0px 0px 0px 34px; text-align: justify; text-indent: -34px; line-height: 1.75em; font-size: 16px;\"><span style=\"font-family: arial, helvetica, sans-serif;\">(3) Machine learning for accelerated materials design<\/span><\/p><\/div>",
