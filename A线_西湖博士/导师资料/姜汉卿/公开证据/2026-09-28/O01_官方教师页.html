      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web trs_word\"><p>Professor Hanqing Jiang is an internationally renowned researcher in solid mechanics. He has conducted cutting-edge research in interdisciplinary topics by bridging materials, mechanics, and multiphysics interactions, including robotics, flexible electronics, lithium-metal batteries, origami, and mechanical metamaterials. He initiated several research topics and led the studies in these areas, such as origami and kirigami-based mechanical metamaterials and flexible electronics, and stress-driven lithium dendrite growth and mitigation using soft materials. Jiang was honored to receive the 2021 Worcester Reed Warner Medal from ASME “for seminal contributions through a series of papers on post-buckling behavior of stiff thin films on soft substrates under large deformation, and its new applications in diverse areas.” He has led more than 30 research projects funded by National Science Foundation and other funding agencies in the US with total grant over $5 M. Jiang has published more than 150 archived papers in leading journals, such as Science, Nature Energy, Nature Nanotechnology, Nature Communications, and PNAS, with total citation more than 20,000 and h-index 71. He has 36 patents issued by the US and other countries.<\/p><p><br\/><\/p><p>Jiang was elected as the Fellow of American Society of Mechanical Engineers in 2016. He was the president of the Society of Engineering Science in 2022. He serves as a member of the Executive Committee of the Materials Division of ASME (chair in 2025). Jiang is the editor and in the editorial board in multiple journals, such as in Extreme Mechanics Letters, and Research (AAAS\/Science Partner Journal).<\/p><p><br\/><\/p><\/div>",
