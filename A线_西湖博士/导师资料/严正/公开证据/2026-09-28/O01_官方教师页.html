      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 21px;background: white\"><span style=\"font-family: Arial, sans-serif\">Zheng YAN was born in 1990 in Shaoxing, Zhejiang, China. He received the Bachelor Degree from Dalian University of Technology in 2013 and the Ph.D in Theoretical Physics from Fudan University in 2019. Thereafter he worked as a Postdoctoral Fellow, then a Research Assistant Professor at the University of Hong Kong. In 2023, he joined the Westlake University as a Tenure-track Assistant Professor (PI). His main research areas are theoretical and numerical studies of quantum many-body physics, as well as related quantum simulation\/computing and quantum materials cross-disciplinary research, currently focusing on:<\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 21px;background: white\"><span style=\"font-family: Arial, sans-serif\"><br\/><\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 21px;background: white\"><span style=\"font-family: Arial, sans-serif\">(1) Novel phase and phase transition, quasi-particle excitation of frustrated quantum magnetisms;<\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 21px;background: white\"><span style=\"font-family: Arial, sans-serif\">(2) Quantum simulation, cold atom array, quantum adiabatic computing, etc.;<\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 21px;background: white\"><span style=\"font-family: Arial, sans-serif\">(3) Constrained quantum many-body systems and related lattice gauge theory, such as quantum dimer\/loop models;<\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 21px;background: white\"><span style=\"font-family: Arial, sans-serif\">(4) Entanglement properties of quantum many-body systems, such as the behaviors of entanglement entropy and spectrum;<\/span><\/p><p style=\"margin: 0;font-family: 宋体;white-space: normal;line-height: 21px;background: white\"><span style=\"font-family: Arial, sans-serif\">(5) Developing numerical methods for strongly correlated systems, especially quantum Monte Carlo and related algorithms;<\/span><\/p><p style=\"margin: 0;font-family: 宋体;white-space: normal;line-height: 21px;background: white\"><br\/><\/p><p style=\"margin: 0;font-family: 宋体;white-space: normal;line-height: 21px;background: white\"><span style=\"font-family: Arial, sans-serif\">In addition to the above directions, he is also willing to actively expand the interdisciplinarity related to quantum many-body physics.<\/span><\/p><p><br\/><\/p><\/div>",
      // 年份和事件必须独立包裹在p标签内，且不可以有多余的p标签
      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>2023-  <\/p><p>Tenure-track Assistant Professor, Westlake University<\/p><p>2022-2023  <\/p><p>Research Assistant Professor, University of Hong Kong<\/p><p>2019-2022  <\/p><p>Postdoc, University of Hong Kong<\/p><p>2013-2019       <\/p><p>Ph.D. degree, Fudan University<\/p><p>2009-2013       <\/p><p>B.S. degree, Dalian University of Technology<\/p><\/div>",
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 28px\"><span style=\"font-family: Arial, sans-serif\">Zheng YAN has (pre-) published about 60 articles, most of which are Phys. Rev. B. The representative achievements are mainly concentrated on three parts:<\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 28px\"><span style=\"font-family: Arial, sans-serif\"><br\/><\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 28px\"><span style=\"font-family: Arial, sans-serif\">1) The sweeping cluster quantum Monte Carlo, which can calculate the local constrained model, is developed by the PI. The algorithm solves the computational problem put forward by pure gauge field models such as quantum dimer\/loop models. It has been included in a single subsection of a numerical textbook recently. Based on the algorithm, the gauge field physics emerging on the frustrated magnetic system and Rydberg array are systematically studied. Such as the phase transition between odd and even Z2 spin liquids is first explored, and the hidden order, which had been thought as a spin liquid in a long time, is discovered. <\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 28px\"><span style=\"font-family: Arial, sans-serif\"><br\/><\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 28px\"><span style=\"font-family: Arial, sans-serif\">2) A scheme for extracting entanglement spectra of large-size many-body systems based on quantum Monte Carlo has been proposed. The entanglement spectra with large entanglement regions are obtained for the first time. Furthermore, the wormhole effect on the path integral of reduced density matrix is put forward to reveal the relationship between entanglement spectrum and energy spectrum. The famous Li-Haldane conjecture has been explained and extended. The numerical experiment for inversing the conjecture has been even realized according to the wormhole mechanism.<\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 28px\"><span style=\"font-family: Arial, sans-serif\"><br\/><\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 28px\"><span style=\"font-family: Arial, sans-serif\">3) Recently, we are focusing on developing the numerical framework of “Bipartite Reweight-annealing” to solve the long-standing problems, such as efficiently extracting entanglement entropy, entanglement negativity, off-diagonal information and magic from quantum many-body systems. It provides a new computing paradigm for quantum Monte Carlo.<\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;line-height: 28px\"><span style=\"font-family: Arial, sans-serif\"><br\/><\/span><\/p><p style=\"margin: 0px; font-family: 宋体; white-space: normal; line-height: 28px;\"><span style=\"font-family: Arial, sans-serif\">Our research group will continue to be committed to driving &quot;physical breakthroughs&quot; through &quot;algorithmic breakthroughs&quot;. Friends with the same aspirations are welcome to join us!<\/span><\/p><\/div>",
      // 教授名字和学刊名用span标签 类名为name包裹 <span class='name'></span>
