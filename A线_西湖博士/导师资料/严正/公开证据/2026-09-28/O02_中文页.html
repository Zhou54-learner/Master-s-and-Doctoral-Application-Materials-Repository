: justify;text-indent: -24px;line-height: 28px\"><span style=\"font-family: 微软雅黑, sans-serif\">3)<span style=\"font-style: normal;font-variant-caps: normal;font-width: normal;font-size: 9px;line-height: normal;font-family: &#39;Times New Roman&#39;;font-size-adjust: none;font-kerning: auto;font-variant-alternates: normal;font-variant-ligatures: normal;font-variant-numeric: normal;font-variant-east-asian: normal;font-variant-position: normal;font-variant-emoji: normal;font-feature-settings: normal;font-optical-sizing: auto;font-variation-settings: normal\">    <\/span><\/span><span style=\"font-family: 微软雅黑, sans-serif\">受限多体系统和晶格规范场，如量子dimer\/loop模型等；<\/span><\/p><p style=\"margin-top: 0;margin-bottom: 0;margin-left: 24px;text-align: justify;text-indent: -24px;line-height: 28px\"><span style=\"font-family: 微软雅黑, sans-serif\">4)<span style=\"font-style: normal;font-variant-caps: normal;font-width: normal;font-size: 9px;line-height: normal;font-family: &#39;Times New Roman&#39;;font-size-adjust: none;font-kerning: auto;font-variant-alternates: normal;font-variant-ligatures: normal;font-variant-numeric: normal;font-variant-east-asian: normal;font-variant-position: normal;font-variant-emoji: normal;font-feature-settings: normal;font-optical-sizing: auto;font-variation-settings: normal\">    <\/span><\/span><span style=\"font-family: 微软雅黑, sans-serif\">量子多体纠缠，如纠缠熵、纠缠谱、无序算符等行为；<\/span><\/p><p style=\"margin-top: 0;margin-bottom: 0;margin-left: 24px;text-align: justify;text-indent: -24px;line-height: 28px\"><span style=\"font-family: 微软雅黑, sans-serif\">5)<span style=\"font-style: normal;font-variant-caps: normal;font-width: normal;font-size: 9px;line-height: normal;font-family: &#39;Times New Roman&#39;;font-size-adjust: none;font-kerning: auto;font-variant-alternates: normal;font-variant-ligatures: normal;font-variant-numeric: normal;font-variant-east-asian: normal;font-variant-position: normal;font-variant-emoji: normal;font-feature-settings: normal;font-optical-sizing:       researchTitle: "学术成果及研究方向", //标题文案抛出
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;text-indent: 32px;line-height: 28px\"><span style=\"font-family: 微软雅黑, sans-serif\">目前发表论文约60篇，大多数是Phys. Rev. B。<a name=\"OLE_LINK1\">我主要从事量子多体物理的理论和计算研究，发展了多项量子蒙卡算法，解决了一些极具挑战的多体计算难题并揭示了若干新奇物理，例如：<\/a><\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;text-indent: 32px;line-height: 28px\"><span style=\"font-family: 微软雅黑, sans-serif\">1<\/span><span style=\"font-family: 微软雅黑, sans-serif\">）发明了sweeping cluster量子蒙卡，解决了quantum dimer\/loop model等纯规范场模型多年来的计算难题，该算法被国外数值方法教材以单独小节介绍；基于该算法，系统研究了冷原子和磁性体系中的演生规范场物理。比如，得到了同时含有奇、偶Z2自旋液体的里德堡阵列相图，发现了一直被认为是自旋液体的新型vison隐藏序等。<\/span><\/p><p style=\"margin-right: 0;margin-left: 0;font-family: 宋体;white-space: normal;text-indent: 32px;line-height: 28px\"><span style=\"font-family: 微软雅黑, sans-serif\">2<\/span><span style=\"font-family: 微软雅黑, sans-serif\">）提出了基于量子蒙卡和随机解析延拓提取多体纠缠谱的方案，解决了高维\/大尺寸系统纠缠谱的计算难题；结合此方案，给出了纠缠谱和能谱的一般关系，指出了约化密度矩阵路径积分上的虫洞效应是形成纠缠谱的根本机制，预言并证实了Li-Haldane猜想的适用范围等。<\/span><\/p><p style=\"margin-right: 0px; margin-left: 0px; font-family: 宋体; white-space: normal; text-indent: 32px; line-height: 28px;\"><span style=\"font-family: 微软雅黑, sans-serif\">3<\/span><span style=\"font-family: 微软雅黑, sans-serif\">）目前课题组正在大力发展的双组份重赋权退火计算框架，解决了量子多体系统中高效提取纠缠熵、纠缠负性、非对角信息、稳定熵等难题。为复杂系统计算提供了一个新的计算范式。这个框架极大地扩展了量子蒙卡算法的适用范围。<\/span><\/p><p style=\"margin-right: 0px; margin-left: 0px; font-family: 宋体; white-space: normal; text-indent: 32px; line-height: 28px;\"><span style=\"font-family: sans-serif;\">课题组将继续致力于以“算法的突破”带动“物理的突破”。<\/span><span style=\"font-family: sans-serif;\">欢迎志同道合的朋友们一起加入！<\/span><\/p><\/div>",
