      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>Fanglin Bao was born in Chun’an, Zhejiang. He graduated from Zhejiang University in 2011 with a bachelor’s degree in physics and in 2016 with a PhD in Optics. He visited The Chinese University of Hong Kong in 2012 as an exchange scholar. He worked at the South China Normal University as a postdoctoral scholar since 2016. He moved to Purdue University in 2019, as a postdoctoral scholar. He then became a research scientist at Purdue in 2021. He joined Westlake University in Jan. 2024 as an assistant professor.<\/p><\/div>",

      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>2024-<\/p><p>Assistant professor，Westlake University<\/p><p>2021-2024<\/p><p>Research scientist，Purdue University <\/p><p>2019-2021<\/p><p>Postdoc，Purdue University<\/p><p>2016-2019 <\/p><p>Postdoc，South China Normal University<\/p><p>2016<\/p><p>Ph.D. degree, Zhejiang University<\/p><p>2011<\/p><p>B.S. degree, Zhejiang University<\/p><p><br\/><\/p><\/div>",
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin-bottom:0\"><span style=\"font-family:&#39;Arial&#39;,sans-serif;color:black\">Dr. Fanglin Bao focused on quantum optical effects in his early career, such as the Casimir effect and the Super-Planckian effect.<\/span><\/p><p style=\"text-align: start; margin-bottom: 0px;\"><span style=\"background-color: white; text-indent: 0em;\"><span style=\"font-family:Arial, sans-serif\">1. <\/span><\/span><span style=\"background-color: white; font-family: 微软雅黑, sans-serif; text-indent: 0em;\">He worked out the renormalization of the Casimir energy in inhomogeneous systems and inhomogeneity-induced correction to the Casimir force；<\/span><\/p><p style=\"text-align: start; margin-bottom: 0px;\"><span style=\"background-color: white; font-family: 微软雅黑, sans-serif; text-indent: -24px;\">2. He proposed a novel mechanism of inhomogeneity-induced lateral Casimir force and predicted the Casimir transport effect. Casimir transport uses Casimir force to levitate and propel nanoparticles, like a nanoscale maglev；<\/span><\/p><p style=\"text-align: start; margin-bottom: 0px;\"><span style=\"background-color: white; font-family: 微软雅黑, sans-serif; text-indent: -24px;\">3. He studied the coupling of surface-plasmon-polariton and hyperbolic-phonon-polariton in graphene-hBN heterostructures and its influence in enhancing the near-field photon tunneling.<\/span><\/p><p style=\"text-align:justify;text-justify:inter-ideograph;line-height:28px\"><span style=\"font-family:&#39;微软雅黑&#39;,sans-serif;color:black;background:white\"><br\/><\/span><\/p><p style=\"text-align:justify;text-justify:inter-ideograph;line-height:28px\"><span style=\"font-family:&#39;微软雅黑&#39;,sans-serif;color:black;background:white\">Recently, Dr. Fanglin Bao focused more on quantum-inspired optical sensing and artificial intelligence (AI).<\/span><\/p><p style=\"text-indent: 0px; text-align: justify; line-height: 28px;\"><span style=\"background-color: white; font-family: 微软雅黑, sans-serif; text-indent: -24px;\">1. He proposed and demonstrated Heat-Assisted Detection and Ranging (HADAR), where he explained and overcame the ghosting effect in traditional thermal imaging. HADAR was highlighted as a Nature cover article and was reported by Nature News &amp; Views, Science News, Nature Photonics News &amp; Views；<\/span><\/p><p style=\"text-indent: 0px; text-align: justify; line-height: 28px;\"><span style=\"background-color: white; font-family: 微软雅黑, sans-serif; text-indent: -24px;\">2. He derived the classical information-theoretic bounds of HADAR-based AI, and he verified their effectiveness in analyzing AI performance in the tasks of HADAR detection and ranging；<\/span><\/p><p style=\"text-indent: 0px; text-align: justify; line-height: 28px;\"><span style=\"background-color: white; font-family: 微软雅黑, sans-serif; text-indent: -24px;\">3. He generalized quantum-inspired imaging to constellations with an unknown number of stars and proposed the first adaptive quantum-inspired algorithms；<\/span><\/p><p style=\"text-indent: 0px; text-align: justify; line-height: 28px;\"><span style=\"background-color: white; font-family: 微软雅黑, sans-serif; text-indent: -24px;\">4. He proposed adaptive photon-thresholding detection. As a smart detector, photon-thresholding detection bridges the common single-photon detection and the challenging photon-number-resolving detection.<\/span><\/p><p style=\"text-indent: 0px; text-align: justify; line-height: 28px;\"><span style=\"background-color: white; font-family: 微软雅黑, sans-serif; text-indent: -24px;\"><br\/><\/span><\/p><p style=\"margin-top:0;text-align:justify;text-justify:inter-ideograph;line-height:28px\"><span style=\"font-family:&#39;微软雅黑&#39;,sans-serif;color:black;background:white\">The main research interest of Prof. Fanglin Bao’s group is about AI physics, including using AI to help discover new physics, using physics laws and concepts to understand AI, classical and quantum limits of AI set by physics laws, physics-inspired machine learning, etc. Other research interests include HADAR, the gravity effect of quantum vacuum zero-point energy, etc.<\/span><\/p><p><br\/><\/p><\/div>",
