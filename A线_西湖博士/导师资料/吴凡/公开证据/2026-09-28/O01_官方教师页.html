		msg: "‘You make experiments and I make theories. Do you know the difference? A theory is something nobody believes, except the person who made it. An experiment is something everybody believes, except the person who made it.’\n— attributed to Albert Einstein, in conversation with Herman Francis Mark | At Westlake, we strive to do both: to make theories experimentally testable, and experiments physically faithful.",

      },
      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin: 0px; text-align: justify; line-height: 28px;\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:#333333;background:white\">Fan Wu obtained his Ph.D. in Optics from the University of Central Florida in 2020 and has conducted postdoctoral research at Cornell University since 2022. He will join the School of Engineering at Westlake University as an Assistant Professor in 2027. He was selected as a 2024 Springer Nature LSA, Rising Star of Light and received the 2024 Eric and Wendy Schmidt AI in Science Postdoctoral Fellowship.<\/span><\/p><\/div>",
      // 年份和事件必须独立包裹在p标签内，且不可以有多余的p标签
      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>2027<\/p><p>Assistant Professor, Westlake University, China<\/p><p>2022<\/p><p>Postdoctoral Researcher, Cornell University, USA<\/p><p>2020<\/p><p>Ph.D., University of Central Florida, USA<\/p><\/div>",
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin-top:0;margin-right:0;margin-bottom:10px;margin-left:0;text-align:justify;text-justify:inter-ideograph;line-height:28px\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">The central theme of our research is to explore how physical systems can compute by harnessing their own natural dynamics. As artificial intelligence continues to grow in scale and complexity, conventional digital hardware faces increasing challenges in energy consumption, speed, and data movement. We ask whether light, waves, nonlinear dynamics, thermodynamic fluctuations, and programmable physical systems can provide a fundamentally different route toward future computing hardware.<\/span><\/p><p style=\"margin-top:0;margin-right:0;margin-bottom:10px;margin-left:0;text-align:justify;text-justify:inter-ideograph;line-height:28px\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">One major direction of our research is <strong>optical thermodynamics<\/strong>. In highly multimode nonlinear optical systems, the enormous number of interacting optical modes makes a microscopic description extremely difficult. Instead of tracking every mode-to-mode interaction, we use concepts from statistical physics and thermodynamics, such as entropy, temperature, chemical potential, and thermal equilibrium, to describe the collective behavior of complex optical fields. This macroscopic viewpoint provides a powerful way to understand phenomena such as beam self-cleaning, optical thermalization, negative optical temperature, and the thermalization of optical orbital angular momentum. More importantly, it suggests a new computing principle: the random fluctuations of a thermalized optical field are not merely noise, but can encode useful information about the underlying physical system. By measuring optical correlations, we aim to develop optical thermodynamic computers capable of performing operations such as matrix inversion and solving linear systems, which are central to scientific computing and next-generation AI algorithms.<\/span><\/p><p style=\"margin-top:0;margin-right:0;margin-bottom:10px;margin-left:0;text-align:justify;text-justify:inter-ideograph;line-height:28px\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">A second major direction is <strong>programmable integrated photonics and optical computing<\/strong>. Traditional inverse-designed photonic devices are usually fixed after fabrication, which limits their flexibility and makes them sensitive to fabrication imperfections. We develop reconfigurable integrated photonic platforms in which an external control light writes continuously tunable refractive-index landscapes into a chip. In this way, a photonic chip can be reprogrammed like software for different tasks. Combined with machine-learning-based feedback optimization, such systems can be trained directly in hardware to perform functions such as optical permutation, mode multiplexing, and matrix–vector multiplication. This approach opens a path toward trainable photonic chips, physical neural networks, and adaptive optical computing systems that can learn from their own measured outputs.<\/span><\/p><p style=\"margin: 0px 0px 10px; text-align: justify; line-height: 28px;\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">Looking forward, our group will pursue <strong>Optics–AI Co-design<\/strong>, a closed-loop research paradigm in which optics and artificial intelligence reinforce each other. On one side, optical physical systems can provide new computing primitives beyond conventional matrix–vector multiplication, including matrix inversion, physical optimization, and dynamics-based computation. On the other side, AI can be used to design, calibrate, and train complex photonic systems that are otherwise too difficult to control. By bringing together optical thermodynamics, programmable photonic chips, analog circuits, nonlinear dynamics, and machine learning, we aim to build a new class of intelligent hardware that computes not by imitating digital processors, but by exploiting what physical systems naturally do best.<\/span><\/p><\/div>",

ong>18, 685–690 (2022).<\/span><\/p><p style=\"line-height:150%\"><span style=\"font-family:&#39;Times New Roman&#39;,serif;color:black\">4. <strong><span style=\"text-decoration:underline;\">F. O. Wu<\/span><\/strong><\/span><strong><sup><span style=\"font-family:&#39;微软雅黑&#39;,sans-serif;color:black\">#<\/span><\/sup><\/strong><span style=\"font-family:&#39;Times New Roman&#39;,serif;color:black\">, Q. Zhong<\/span><strong><sup><span style=\"font-family:&#39;微软雅黑&#39;,sans-serif;color:black\">#<\/span><\/sup><\/strong><span style=\"font-family:&#39;Times New Roman&#39;,serif;color:black\">, H. Ren, P. S. Jung, K. G. Makris, and D. N. Christodoulides, Thermalization of Light&#39;s Orbital Angular Momentum in Nonlinear Multimode Waveguide Systems, <strong><em>Physical Review Letters<\/em><\/strong> 128, 123901 (2022).<\/span><\/p><p style=\"line-height:150%\"><span style=\"font-family:&#39;Times New Roman&#39;,serif;color:black\">3. L. G. Wright, <strong><span style=\"text-decoration:underline;\">F. O. Wu<\/span><\/strong>, D. N. Christodoulides, and F. W. Wise, Physics of highly multimode nonlinear optical systems, <strong><em>Nature Physics<\/em> <\/strong>18, 1018-1030 (2022).<\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph;line-height:150%\"><span style=\"font-family:&#39;Times New Roman&#39;,serif;color:black\">2. P. S. Jung, G. G. Pyrialakos, <strong><span style=\"text-decoration:underline;\">F. O. Wu<\/span><\/strong>, M. Parto, M. Khajavikhan, W. Krolikowski, D. N. Christodoulides, Thermal control of the topological edge flow in nonlinear photonic lattices, <strong><em>Nature Communications<\/em><\/strong> 13, 4393 (2022).<\/span><\/p><p style=\"line-height: 150%;\"><span style=\"font-family:&#39;Times New Roman&#39;,serif;color:black\">1. <strong><span style=\"text-decoration:underline;\">F.O. Wu<\/span><\/strong>, A.U. Hassan, and D.N. Christodoulides, Thermodynamic theory of highly multimoded nonlinear optical systems, <strong><em>Nature Photonics<\/em><\/strong> 13, 776 (2019).<\/span><\/p><\/div>",

          title: "Contact Us",
          content: "<div class=\"view TRS_UEDITOR trs_paper_default trs_word\"><p style=\"line-height:28px;background:white\"><span style=\"font-size:16px;font-family:&#39;Helvetica&#39;,sans-serif;color:black\">Email: <\/span><span style=\"color:black\"><a href=\"mailto:wufan@westlake.edu.cn\"><span style=\"font-size:16px;font-family: &#39;Helvetica&#39;,sans-serif\">wufan@westlake.edu.cn<\/span><\/a><\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\"> <\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">In the Wu Lab, we conduct cutting-edge research at the intersection of photonics, artificial intelligence, statistical physics, nonlinear dynamics, analog computing, and unconventional computing. The group will focus on programmable integrated photonic chips, optical thermodynamic computing, physical neural networks, and next-generation physical computing hardware for artificial intelligence.<\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">We welcome outstanding young researchers with backgrounds in photonics, physics, electrical engineering, integrated circuits, artificial intelligence, nanofabrication, nonlinear dynamics, or related interdisciplinary fields. Together, we aim to explore a new generation of machines that compute by harnessing the natural dynamics of physical systems.<\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">We are currently recruiting postdoctoral researchers, with a particular interest in candidates with backgrounds in the following areas:<\/span><\/p><p style=\"margin-top:0;margin-right:0;margin-bottom:0;margin-left:48px;text-align:justify;text-justify:inter-ideograph;text-indent:-24px\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">1.<span style=\"font:9px &#39;Times New Roman&#39;\">  <\/span><\/span><strong><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">Optical nanofabrication<\/span><\/strong><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">: candidates with experience in integrated photonic device design and fabrication, photonic chip testing, silicon photonics, lithium niobate photonics, thin-film photonic platforms, or related areas. <\/span><\/p><p style=\"margin-top:0;margin-right:0;margin-bottom:0;margin-left:48px;text-align:justify;text-justify:inter-ideograph;text-indent:-24px\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">2.<span style=\"font:9px &#39;Times New Roman&#39;\">  <\/span><\/span><strong><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">Analog integrated circuit design<\/span><\/strong><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">: candidates with experience in analog or mixed-signal circuit design, on-chip driving and readout circuits, optoelectronic co-design, low-noise amplification, circuit modeling, or layout design. <\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\"> <\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph\"><strong><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">How to apply:<\/span><\/strong><\/p><p style=\"margin-top:0;margin-right:0;margin-bottom:0;margin-left:48px;text-align:justify;text-justify:inter-ideograph;text-indent:-24px\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">1.<span style=\"font:9px &#39;Times New Roman&#39;\">  <\/span><\/span><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">Applications for the Ph.D. program should be submitted online. For more information, please refer to the Westlake University School of Engineering Graduate Program. Prospective Ph.D. students are also welcome to contact us before applying. Please include your CV and transcript in your inquiry.<\/span><\/p><p style=\"margin-top:0;margin-right:0;margin-bottom:0;margin-left:48px;text-align:justify;text-justify:inter-ideograph;text-indent:-24px\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">2.<span style=\"font:9px &#39;Times New Roman&#39;\">  <\/span><\/span><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">Applications for postdoctoral or research assistant positions should include a CV and a research statement.<\/span><\/p><p style=\"margin: 0px; text-align: justify;\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">Materials for Ph.D. inquiries and postdoctoral\/research assistant applications should be sent directly to the email address above.<\/span><\/p><\/div>",
