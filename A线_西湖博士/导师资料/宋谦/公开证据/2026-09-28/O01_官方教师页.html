      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin: 0px; text-align: justify; line-height: 28px;\"><span style=\"font-family:&#39;Arial&#39;,sans-serif\">Dr. Song received his B.S. degree in Physics from Nanjing University in 2017 and his Ph.D. degree in Materials Science and Engineering from Massachusetts Institute of Technology (MIT) in 2024. From 2024 to 2025, he worked as a postdoctoral researcher in the Department of Physics at MIT. Since 2025, he has been a postdoctoral researcher in the Department of Physics at University of California, Berkeley. He will join Westlake University as an Assistant Professor in July 2027.<\/span><\/p><\/div>",
      // 年份和事件必须独立包裹在p标签内，且不可以有多余的p标签
      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>2027<\/p><p>Assistant Professor, Westlake University<\/p><p>2026<\/p><p>Postdoctoral Associate, University of California, Berkeley<\/p><p>2025<\/p><p>Postdoctoral Associate, Massachusetts Institute of Technology<\/p><p>2024<\/p><p>Ph.D. Degree, Massachusetts Institute of Technology<\/p><p>2017<\/p><p>Bachelor’s degree, Nanjing University<\/p><\/div>",
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph;line-height:28px\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:#333333\">The interplay among lattice, orbital, spin, and charge degrees of freedom in quantum materials gives rise to a rich landscape of emergent electronic phases, including unconventional magnetism, ferroelectricity, charge and spin density waves, superconductivity, etc. These correlated electronic states exhibit rich and exotic quantum phenomena at two-dimension, surfaces and interfaces, and confined systems.<\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph;line-height:28px\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:#333333\">Our research group combines a suite of complementary experimental techniques—including crystal growth, optical spectroscopy, transport, and scanning probe microscopy—together with theoretical approaches such as symmetry analysis and numerical simulations, to investigate the microscopic mechanisms underlying these correlated electronic states. The group further explores their responses to external stimuli, including electric fields, magnetic fields, doping, and strain, with the goal of achieving precise control over electronic properties and functionalities.<\/span><\/p><p style=\"margin: 0px; text-align: justify; line-height: 28px;\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:#333333\">The unique physical properties of quantum materials provide exciting opportunities for next-generation information technologies, particularly in data storage and computing. These unconventional electronic phases may enable advanced functionalities such as ultrafast dynamics, high energy efficiency, robust endurance, highly sensitive readout, and compact integration. Our group designs novel device architectures, fabricates them at the nanoscale, and systematically evaluates their potential functionality.<\/span><\/p><\/div>",

;Times New Roman&#39;,serif;color:black\">5. L. GP. Martins, D. A. Ruiz-Tijerina, C. A. Occhialini, J. Park, <strong>Q. Song<\/strong>, A. Lu, P. Venezuela, L. G. Cançado, M. SC. Mazzoni, M. JS. Matos, J. Kong, R. Comin*. “Pressure tuning of minibands in MoS<sub>2<\/sub>\/WSe<sub>2<\/sub> heterostructures revealed by moiré phonons” <strong><em>Nat. Nanotechnol.<\/em><\/strong> 18, 1147-1153 (2023).<\/span><\/p><\/div>",
