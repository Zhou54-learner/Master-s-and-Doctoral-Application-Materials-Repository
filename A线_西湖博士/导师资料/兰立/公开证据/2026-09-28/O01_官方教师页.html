      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p><span style=\"font-family: arial, helvetica, sans-serif;font-size: 16px;text-wrap: wrap\">Lan Li obtained her B. S. degree from University of Science and Technology of China (2010) and Ph.D. degree from University of Delaware (2016), both in Materials Science and Engineering. Since then she has been the postdoctoral associate at the Massachusetts Institute of Technology. She was recognized with the Chinese Government Award for Outstanding Students Abroad (2015) and Norbert J. Kreidl Award for Young Scholars (2016) by American Ceramic Society Glass and Optical Materials Division. Dr. Li accepted the offer as an assistant professor in Westlake University and returned to China in early 2019. Her research interest focuses on nanophotonic materials and devices, infrared optical glass materials, integrated flexible photonic device fabrication, characterization and application.<\/span><\/p><\/div>",
      // 年份和事件必须独立包裹在p标签内，且不可以有多余的p标签
      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>2022<\/p><p>Excellent teacher Award in the city of Hangzhou<\/p><p>2021<\/p><p>The 2021 Faculty Award for Excellence in Services in the School of Engineering, Westlake University<\/p><p>2020<\/p><p>Innovative Leading Talent of Zhejiang Province<\/p><p>2019<\/p><p>Assistant Professor in the School of Engineering, Westlake University<\/p><p>Postdoc Associate in Material Science &amp; Engineering, Massachusetts Institute of Technology<\/p><p>2016<\/p><p>Norbert J. Kreidl Award for Young Scholars, awarded by the Glass &amp; Optical Materials Division of the American Ceramic Society <\/p><p>Ph.D. in Material Science &amp; Engineering, University of Delaware<\/p><p>2015<\/p><p>The Chinese Government Award for Outstanding Students Abroad<\/p><p>2010<\/p><p>B.S. in Material Science &amp; Engineering, University of Science &amp; Technology of China<\/p><\/div>",
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"line-height: 1.75em;text-wrap: wrap;text-align: justify\"><span style=\"font-family: arial, helvetica, sans-serif;font-size: 16px\">Flexible integrated photonics is a new technology that has only started to burgeon in the past few years, which enables a wide cross-section of emerging applications ranging from flexible optical interconnects, broadband photonic tuning to conformal sensors on biological tissues.<\/span><\/p><p style=\"line-height: 1.75em;text-wrap: wrap;text-align: justify\"><br\/><\/p><p style=\"line-height: 1.75em;text-wrap: wrap;text-align: justify\"><span style=\"font-family: arial, helvetica, sans-serif;font-size: 16px\">Dr. Li has pioneered a monolithic approach to realize flexible, high-index-contrast glass photonics with significantly improved processing throughput and yield. She also demonstrated flexible photonic devices with record optical performance and extreme mechanical robustness, which can sustain over thousands of bending or stretching cycles by adopting the developed mechanics theory accounting for multiple neutral axes. This theory can accurately predict the strain-optical coupling behavior within the laminated structures. She further proved that the developed technology can also offer a facile fabrication route for heterogeneous integration with active components as well as 3-D photonic devices such as vertically coupled micro-resonators, adiabatic inter-layer waveguide couplers and photonic crystal. Those multilayer devices are usually difficult to process using traditional methods. The related research work has been highlighted as one of the most exciting peer-reviewed optics research by the Optical Society of America (&quot;Optics in 2014&quot; special issue of OSA&#39;s Optics &amp; Photonics News).<\/span><\/p><p style=\"line-height: 1.75em;text-wrap: wrap;text-align: justify\"> <\/p><p style=\"line-height: 1.75em;text-wrap: wrap;text-align: justify\"><span style=\"font-family: arial, helvetica, sans-serif;font-size: 16px\">Her future work will continue focusing on the technology development and the practical implementation of flexible integrated photonics. The research directions include but are not limited to the following:<\/span><\/p><p style=\"line-height: 1.75em;text-wrap: wrap;text-align: justify\"><span style=\"font-family: arial, helvetica, sans-serif;font-size: 16px\">1. Photonic integration development with novel materials such as infrared optical glass materials, biocompatible oxides, polymer, 2D materials, semiconductor membrane, etc;<\/span><\/p><p style=\"line-height: 1.75em;text-wrap: wrap;text-align: justify\"><span style=\"font-family: arial, helvetica, sans-serif;font-size: 16px\">2. Design, fabrication and testing of passive and active components with new functionalities;<\/span><\/p><p style=\"line-height: 1.75em;text-wrap: wrap;text-align: justify\"><span style=\"font-family: arial, helvetica, sans-serif;font-size: 16px\">3. Investigation and application of flexible photonic chip in the field of wearable sensing, optical interconnect, and biotechnology. <\/span><\/p><p><br\/><\/p><\/div>",
