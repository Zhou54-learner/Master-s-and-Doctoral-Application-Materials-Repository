      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin: 0px; text-align: justify; line-height: 28px;\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:#333333;background:white\">Dr. Qiuyang Li was born in the city of Maanshan, Anhui Province. He received B.S. degree with honor of Materials Physics from University of Science and Technology of China in 2013. He received Ph.D. degree in Chemistry from Emory University (USA) in 2019 under the supervision of Prof. Tianquan (Tim) Lian, using transient absorption spectroscopy to study excitons in 2D nanocrystals. After graduation, Dr. Qiuyang Li joined Department of Chemistry, Columbia University (USA) as a MRSEC Postdoctoral Fellow working with Prof. Xiaoyang Zhu on angle-resolved photoemission spectroscopy and 2D materials. Later, he moved to Department of Physics, University of Michigan (USA) working with Prof. Hui Deng on light-matter interaction and cavity engineering of 2D materials. Dr. Qiuyang Li is an assistant professor at the School of Engineering, Westlake University, leading an independent research group to explore ultrafast spectroscopic research and cavity engineering of low-dimensional quantum materials.<\/span><\/p><\/div>",

      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>2026<\/p><p>Assistant Professor, Westlake University<\/p><p>2021<\/p><p>Postdoctoral Research Fellow, University of Michigan (USA)<\/p><p>2019<\/p><p>Chinese Government Award for Outstanding Self-financed Students Abroad<\/p><p>MRSEC Postdoctoral Fellow, Columbia University (USA)<\/p><p>Ph.D., Emory University (USA)<\/p><p>2018<\/p><p>Quayle Senior Student Award, Emory University (USA)<\/p><p>2015<\/p><p>Osborne R. Quayle Fellowship, Emory University (USA) <\/p><p>2013<\/p><p>B.S. with honor, University of Science and Technology of China<\/p><\/div>",
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph;line-height:28px\"><span style=\"font-family: Helvetica, sans-serif;\">Dr. Qiuyang Li uses static and ultrafast spectroscopy (including but not limited to transient absorption\/photoluminescence spectroscopy, angle-resolved photoemission spectroscopy, time-resolved Faraday rotation spectroscopy, confocal microscopy, etc.) to explore and manipulate photophysics, emerging properties, and new states of matter of low-dimensional quantum materials. He has published 47 papers in total, including 20 first-authored papers in top journals like Phys. Rev. Lett., Nature Communications, J. Am. Chem. Soc., ACS Nano, Nano Lett., Chem. Rev., and Acc. Chem. Res.<\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph;line-height:28px\"><span style=\"font-family: Helvetica, sans-serif;\"><br\/><\/span><\/p><p style=\"margin: 0px; text-align: justify; line-height: 28px;\"><span style=\"font-family: Helvetica, sans-serif;\">Li Research Group focuses on interdisciplinary research involving ultrafast spectroscopy, condensed matter physics, and cavity engineering. The main research directions include: (1) cavity sensing and engineering of 2D <\/span><span style=\"font-family: Helvetica, sans-serif;\">moiré <\/span><span style=\"font-family: Helvetica, sans-serif;\">quantum matter; (2) ultrafast optical control and cavity engineering of collective behaviors and ordered states in low-dimensional quantum materials; (3) establishing, probing, and engineering of newly formed 2D van der Waals multiferroic materials.<\/span><\/p><\/div>",

          content: "<div class=\"view TRS_UEDITOR trs_paper_default trs_word\"><p style=\";background:white\"><span style=\"font-size: 16px;font-family:&#39;Helvetica&#39;,sans-serif;color:black\">Email: <\/span><span style=\"color:black\"><a href=\"mailto:liqiuyang@westlake.edu.cn\"><span style=\"font-size:16px;font-family:&#39;Helvetica&#39;,sans-serif\">liqiuyang@westlake.edu.cn<\/span><\/a><\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\"> <\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:black\">Li Research Group is currently recruiting graduate students, postdoctoral fellows, and undergraduate students:<\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph\"><span style=\"text-indent: 0em; font-family: Helvetica, sans-serif;\">1. For graduate students<\/span><span style=\"text-indent: 0em; font-family: 微软雅黑, sans-serif;\">：<\/span><span style=\"text-indent: 0em; font-family: Helvetica, sans-serif;\">We welcome undergraduate students and master degree students who are interested in spectroscopy, low-dimensional quantum- or nano-materials, light-matter interaction, and cavity\/photonic engineering to apply. Feel free to communicate with Dr. Qiuyang Li at <\/span><a href=\"mailto:liqiuyang@westlake.edu.cn\" style=\"text-indent: 0em;\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif\">liqiuyang@westlake.edu.cn<\/span><\/a><span style=\"text-indent: 0em; font-family: Helvetica, sans-serif;\"> and we are eager to hear from you!<\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph\"><span style=\"text-indent: 0em; font-family: Helvetica, sans-serif;\">2. For postdocs: We welcome researchers who have (or will soon have) a PhD degree with research background of (including but not limited to) condensed matter physics, materials science, optics, physical chemistry, etc. to apply. The researchers with the below research backgrounds will be considered in priority: static\/ultrafast spectroscopy, 2D van der Waals materials and devices (both photonic and electronic), low-dimensional nanomaterials (e.g., nanocrystals, 2D perovskites), LabView or Python for experimental setup control. Please feel free to send your CV and recommendation letters to <\/span><a href=\"mailto:liqiuyang@westlake.edu.cn\" style=\"text-indent: 0em;\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif\">liqiuyang@westlake.edu.cn<\/span><\/a><span style=\"text-indent: 0em; font-family: Helvetica, sans-serif;\">. We will offer highly competitive salary and support compared to equivalent positions both domestically and internationally (details to be discussed in person).<\/span><\/p><p style=\"margin: 0px; text-align: justify;\"><span style=\"font-family: Helvetica, sans-serif; text-indent: 0em;\">3. For undergraduate students: We welcome undergraduate students who are interested in spectroscopy, materials science, and optics to conduct research and do their internship in our group. Please feel free to contact Dr. Qiuyang Li.<\/span><\/p><\/div>",
