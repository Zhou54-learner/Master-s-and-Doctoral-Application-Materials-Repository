      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin: 0px; text-align: justify; line-height: 28px;\"><span style=\"font-family:&#39;Helvetica&#39;,sans-serif;color:#333333;background:white\">Danzhen Zhang was born in 1997 in Changzhi, Shanxi Province, China. He received his B.Eng. degree from Tsinghua University in 2019 and his Ph.D. degree from Drexel University in 2024, under the supervision of Prof. Yury Gogotsi. He subsequently joined the Querrey Simpson Institute for Bioelectronics at Northwestern University as a postdoctoral researcher, working with Prof. John A. Rogers. He received several honors including the Outstanding Graduate Award of Beijing, the Excellent Graduate Award of Tsinghua University, and the Outstanding Doctoral Graduate Award of Drexel University. He will join Westlake University as a full-time faculty member in July 2027.<\/span><\/p><\/div>",

      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"text-align: justify;\">Since their discovery, MXene materials have demonstrated significant potential in energy storage, electromagnetic interference shielding, optoelectronic modulation, and flexible electronics owing to their unique two-dimensional layered structures, metallic-level electrical conductivity, rich and tunable surface terminations, excellent solution processability, and outstanding mechanical flexibility.Dr. Danzhen Zhang’s research achievements include establishing a quantitative analytical framework for investigating the electrochemical energy-storage mechanisms of MXenes based on in situ UV–Vis spectroscopy, realizing electrochemically dynamic modulation of MXene–microwave interactions, and expanding the applications of MXenes in highly efficient fully stretchable OLEDs, biointegrated devices.He has published 23 SCI-indexed papers, including 7 as first or co-first author, in journals such as Nature, Nature Energy, Nature Nanotechnology, and Materials Today. He also serves as a reviewer for journals including ACS Nano and Energy Storage Materials, and is currently a Guest Editor for Soft Science.<\/p><p><br\/><\/p><\/div>",
