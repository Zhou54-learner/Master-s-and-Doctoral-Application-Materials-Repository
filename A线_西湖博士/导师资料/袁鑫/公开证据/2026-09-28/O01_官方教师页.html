      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin: 0px; text-align: left;\"><span style=\"font-size:15px;font-family:&#39;微软雅黑&#39;,sans-serif;color:black\">Dr. Xin Yuan received his B.Eng. and M.Eng. degrees from Xidian University, in 2007 and 2009, respectively, and his Ph.D. degree from The Hong Kong Polytechnic University in 2012. From 2012 to 2015, he had been a Postdoctoral Associate with the Department of Electrical and Computer Engineering, Duke University, where he was working on compressive sensing and machine learning. From 2015 to 2021, he was a Video Analysis and Coding Lead Researcher at Bell Labs, Murray Hill, NJ 07974, USA. He had received several best paper awards in international conferences. He has been the Associate Editor of Pattern Recognition since 2019. He is the leading guest editor of the special issue of “Deep Learning for High Dimensional Sensing” in the IEEE Journal of Selective Topics in Signal Processing (2021). Dr. Yuan Joined the Westlake University in 2021 as an Associate Professor in School of Engineering.<\/span><\/p><\/div>",

      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_word trs_web\"><p>2023<\/p><p>Computational Imaging Conference 2023，Sydney，Australia<\/p><p>JSAP-Optica Joint Symposia 2023 Invited Talk，Kumamoto, Japan<\/p><p>Silver Prize in the Start-up Group at the 12th Innovation and Entrepreneurship Contest Zhejiang Provincial Finals<\/p><p>Second Prize in the “Maker in China” SME Innovation and Entrepreneurship Global Contest (“SME IEGC”)  in the Start-up Group<\/p><p>2022<\/p><p>Distinguished Young Scholar of Zhejiang Province<\/p><p>13th International Conference on Information Optics and Photonics (Keynote talk)<\/p><p>2021 Ten Major Advances in Optics in China (invited talk)<\/p><p>2021 <\/p><p>Associate Professor, School of Engineering, Westlake University<\/p><p>National Excellent Young Scholar (overseas program)<\/p><p>High-level talent in Zhejiang Province<\/p><p>2021 International Conference on Optical Instrument and Technology (Plenary talk)<\/p><p>2015<\/p><p>Video Analysis and Coding Lead Researcher at Bell Labs Murray Hill, NJ 07974, USA<\/p><p>2012<\/p><p>Postdoctoral Fellow, Duke University, NC, USA<\/p><p>2012<\/p><p>Ph.D. degree，Hong Kong Polytechnic University<\/p><p>2009<\/p><p>Master degree, National Key Laboratory of Radar Signal Processing，Xidian University<\/p><p>2007<\/p><p>Bachelor degree，Xidian University<\/p><p><br\/><\/p><\/div>",
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph\"><span style=\"font-size:15px;font-family:&#39;微软雅黑&#39;,sans-serif;color:black\">Dr. Xin Yuan has been working on computational imaging since 2012, which includes the hardware system design (usually using optics, please refer to papers published in CVPR, ICCV, ECCV, Optica, Optics Letters, Optics Express and APL Photonics), algorithm development including optimization-based algorithms (please refer to papers published in IEEE T-PAMI, T-IP, T-SP and IJCV) and deep-learning-based algorithms (please refer to papers published in CVPR, ICCV and ECCV). Furthermore, Dr. Yuan works with colleagues on the theoretical derivation of computational imaging systems (please refer to papers published in IEEE T-IT). Dr. Yuan also works on machine learning models for other data analysis (please refer to papers published in ICML, NeurIPS and AISTATS).<\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph\"><span style=\"font-size:15px;font-family:&#39;微软雅黑&#39;,sans-serif;color:black\"> <\/span><\/p><p style=\"margin: 0px; text-align: justify;\"><span style=\"font-size:15px;font-family:&#39;微软雅黑&#39;,sans-serif;color:black\">Currently, Dr. Yuan is working on the Snapshot Compressive Imaging (refer to the review paper published in IEEE Signal Processing Magazine entitled “Snapshot Compressive Imaging: Theory, Algorithms and Applications” doi: 10.1109\/MSP.2020.3023869), also known as the SCI. SCI uses a two-dimensional (2D) detector to capture high-dimensional (HD, i.e., 3D or larger) data in a snapshot measurement. Via novel optical designs, the 2D detector samples the HD data in a compressive manner; following this, algorithms are employed to reconstruct the desired HD data-cube. SCI has been used in hyperspectral imaging, video, holography, tomography, focal depth imaging, polarization imaging, microscopy, etc. Though the hardware has been investigated for more than a decade, the theoretical guarantees have only recently been derived in 2019. Inspired by deep learning, various deep neural networks have also been developed to reconstruct the HD data-cube in spectral SCI and video SCI. Dr. Yuan and his collaborators are leading the state-of-the-art SCI reconstruction algorithms, both in optimization (T-PAMI) and deep learning (CVPR, ECCV and ICCV).<\/span><\/p><\/div>",
