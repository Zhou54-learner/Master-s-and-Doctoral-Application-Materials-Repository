      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_word\"><p style=\"text-align: justify;\">Dr. Zexi Liang was born in Beijing in 1992. He received his B.S. in Physics from Peking University in 2015 and his Ph.D. in Materials Science and Engineering from The University of Texas at Austin in 2021, where he worked with Prof. Donglei Fan. From 2021 to 2026, he was a postdoctoral researcher in the Department of Physics at Cornell University, working with Prof. Itai Cohen and Prof. Paul McEuen. He  joined the Department of Electronic and Information Engineering, School of Engineering, Westlake University, as an Assistant Professor in July 2026.<\/p><\/div>",
      // 年份和事件必须独立包裹在p标签内，且不可以有多余的p标签
      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_word trs_web\"><p>2026<\/p><p>Assistant Professor,  Westlake University<\/p><p>2021<\/p><p>Postdoctoral Researcher, Department of Physics, Cornell University<\/p><p>2021<\/p><p>Ph.D. in Materials Science and Engineering, The University of Texas at Austin<\/p><p>2015<\/p><p>B.S. in Physics, Peking University<\/p><\/div>",
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_word\"><p style=\"text-align: justify; text-indent: 0em;\">Dr. Liang’s research group focuses on small-scale robotics, intelligent microsystems, and microscopic self-assembly. The group integrates advanced small-scale manufacturing, precision fabrication, multimaterial heterogeneous integration, acoustic\/optical\/electrical\/magnetic multiphysics micromanipulation, soft matter physics, microelectromechanical systems, robotic control, and the integration of miniature machines with integrated circuits. Over the past decades, microelectronic devices, micro\/nanomotors, and miniature robots have made important progress in miniaturization and functionalization. However, achieving efficient actuation, controllable interactions, mechanical output, system integration, and embedded intelligence from the micro\/nanoscale to the millimeter scale remains a central challenge. Dr. Liang’s research addresses this challenge by encoding geometry, materials, magnetism, and optoelectronic responses into miniature building blocks, and by using acoustic, optical, electrical, magnetic, and complex fluidic environments to achieve precise actuation, selective recognition, reconfigurable assembly, and collective control.<\/p><p style=\"text-align: justify; text-indent: 0em;\">From optoelectronic micromanipulation and micro\/nanomotor research during his Ph.D. studies to magnetic microrobotics, information-encoded self-assembly, reconfigurable microsystems, and the integration of micro\/nanoactuators with microelectronic chips during his postdoctoral research, Dr. Liang has focused on a central question: how small-scale machines can be manufactured, actuated, programmed, and integrated. His work has developed new methods and platforms for precise micromachine manipulation, collective behaviors, programmable interactions, error-correcting self-assembly, and heterogeneous system integration. His research findings have been published in prestigious international journals such as Science, Proceedings of the National Academy of Sciences of the United States of America, Nature Nanotechnology, Science Advances, Nature Communications, Advanced Materials, and ACS Nano.<\/p><p style=\"text-align: justify; text-indent: 0em;\">The Small-Scale Precision Robotics Laboratory aims to develop manufacturable, programmable, and integrated robotic systems at small scales for future robotics, microsystems, and healthcare engineering. The lab will study not only micro\/nanoscale machines, but also broader miniature robotic platforms at the millimeter and sub-centimeter scales. Research directions include small-scale robotics and intelligent microsystems, advanced small-scale manufacturing, precision fabrication and multimaterial integration, magnetic\/optical\/electrical\/acoustic multiphysics actuation and collective control, soft matter, active matter and living-system interfaces, and applications in biomedical micromanipulation, surgical robotic end-effectors, intelligent fibers and microcatheters, organoid interfaces, and distributed intelligent machines.<\/p><\/div>",
