      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"text-indent: 0em;text-align: justify\">Wei Kong received his BS degree from Sun Yat-sen University, China, in 2007, and Ph.D. degree in Electrical and Computer Engineering from Duke University in 2016. He worked as a postdoc in Massachusetts Institute of Technology with Prof. Jeehwan Kim from 2016 to 2020, before joining Westlake University. Wei Kong has published more than 25 research papers, and 6 US patents. Wei Kong received the 2018 Energy Fellow from MIT.<\/p><p style=\"text-indent: 0em;text-align: justify\"><br\/><\/p><p><br\/><\/p><\/div>",

      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"line-height: 28px;margin: 0px;padding: 0px;overflow-wrap: break-word;font-family: 宋体;font-size: 16px;text-wrap: wrap;background-color: rgb(255, 255, 255);text-align: justify\"><span style=\"font-family: Arial, sans-serif\">His research interests are in the synthesis and processing of novel high-performance semiconductor materials, and their applications in electrical and optical devices. His recent research activities involve the development of single-crystalline ultrathin semiconductor materials, including 2D materials (graphene, hBN and TMDCs), and free-standing III-V nitrides, II-VI oxides membranes. Wei Kong aims to develop the platform for heterointegration of dissimilar thin film semiconductors, in order to achieve the multi-functionalities required in the emerging applications such as in internet of things, artificial intelligent, human-machine interfacing. <\/span><\/p><p style=\"margin: 0px;padding: 0px;overflow-wrap: break-word;font-family: &#39;Avenir Next&#39;, BlinkMacSystemFont, -apple-system, &#39;Helvetica Neue&#39;, Helvetica, Arial, sans-serif;text-wrap: wrap;background-color: rgb(255, 255, 255);text-align: justify;line-height: 0.26rem !important;font-size: 0.18rem !important\"><br\/><\/p><p><br\/><\/p><\/div>",
