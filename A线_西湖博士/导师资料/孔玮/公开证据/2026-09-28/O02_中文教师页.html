      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin-top: 0px;text-wrap-mode: wrap\">　　孔玮博士2007年本科毕业于中山大学物理学院; 2016年于杜克大学电子工程系获博士学位，研究方向为III-V族化合物合成和器件制备；2016年至2020年在麻省理工学院机械工程系从事博士后研究，方向为低维材料及体材料异质结构，开拓了异质材料多功能集成的新研究方向。<\/p><p><br\/><\/p><\/div>",

      researchTitle: "学术成果及研究方向", //标题文案抛出
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin-top: 0px;text-wrap-mode: wrap\"><br\/><\/p><p style=\"text-wrap-mode: wrap\">实验室概况<\/p><p style=\"text-wrap-mode: wrap\">　　基于过去半个世纪的大量科研投入，硅基半导体材料的物理极限被充分发掘，现代电子器件的进一步发展受限于硅材料的本征性能及其单一功能，对下一代非硅半导体技术的研究是未来电子科技进步的基础和动力。本实验室主要从事下一代高性能晶体半导体材料合成、工艺开发以及器件应用研究。主要研究方向为：<\/p><p style=\"text-wrap-mode: wrap\">    （1）开发新型二维材料或超薄准二维材料，现阶段涉及III-V族氮化物、II-VI族氧化物，以及石墨烯、氮化硼、过渡金属硫化物；<\/p><p style=\"text-wrap-mode: wrap\">    （2）开发三维异质结构堆叠工艺，探索界面产生的包括力学、电学、光学、热学等物理现象；<\/p><p style=\"text-wrap-mode: wrap\">    （3）由此开发功能集成，可应用于集成电路和集成光学。<br\/><\/p><p style=\"text-wrap-mode: wrap;\">    本实验室研究致力于开拓超微型多功能集成芯片的新解决方案，并应用于人工智能、人机界面、物联网等未来场景。<\/p><\/div>",
