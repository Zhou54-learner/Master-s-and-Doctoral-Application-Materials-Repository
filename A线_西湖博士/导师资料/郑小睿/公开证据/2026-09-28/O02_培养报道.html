        mainTitle: "The Journey of a New Mentor: Xiaorui Zheng\'s First Years at Westlake University",//大标题
        Author: "",

        ],
        detailContent: "<div class=\"view TRS_UEDITOR trs_paper_default trs_word trs_web\"><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Prof. Xiaorui Zheng, a principal investigator in the Department of Electronic Information Engineering at the Westlake University School of Engineering, sits before a stack of just-printed papers. Recently, the four Ph.D. students he supervises—three of whom are part of the first cohort he recruited after joining Westlake University—have all published their research in academic journals. This marks a significant step in their journey of scientific exploration, as they begin to enjoy the scenery and excitement of advancing in their field.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\"><br\/><\/p><p style=\"margin: 0px 0px 11px; line-height: 18.4px; font-size: 16px; font-family: Aptos, sans-serif; text-wrap: wrap; text-align: center;\"><img src=\".\/W020250106523404208432_ORIGIN.png\" data-uploadpic=\"W020250106523404208432_ORIGIN.png\" needdownload=\"true\" data-needdownload=\"true\" title=\"Screenshot 2025-01-06 at 2.30.40 PM.png\" alt=\"\" style=\"text-align: center;text-wrap-mode: wrap;width: 500px\" uploadpic=\"W020250106523404208432_ORIGIN.png\" picname=\"Screenshot 2025-01-06 at 2.30.40 PM.png\" OLDSRC=\"W020250106523404208432_ORIGIN.png\" \/><br\/><span style=\"color: rgb(127, 127, 127); font-size: 14px;\">Xiaorui<\/span><span style=\"color: rgb(127, 127, 127); font-size: 14px;\"> Zheng<\/span><\/p><p style=\"margin: 0px 0px 11px; line-height: 18.4px; font-size: 16px; font-family: Aptos, sans-serif; text-wrap: wrap; text-align: center;\"><br\/><\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">&quot;Consider the results as a ‘by-product,’ and focus on becoming a better version of yourself.&quot;<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Zheng flips through these research papers, each densely packed with text, pulling him back to four years ago.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">It was around this time that he began his role as a mentor. The Yunqi Campus was small, with few people, and as a newcomer, Zheng didn’t know anyone. At the Yunqi Campus coffee bar, a few outdoor tables were set up in front of Building 5. One October afternoon, he sat under an umbrella, chatting with someone who was working on semiconductor materials. His work was impressive, and Zheng later learned that this person was Prof. Lin Xiao from the Department of Physics at the School of Science.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">“I had seen his work on the website, but I had never met him in person,” Zheng recalls.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Also present that day was Prof. Wenbin Li from the Department of Materials Science and Engineering at the School of Engineering. The three of them quickly hit it off and decided to collaborate on research involving low-dimensional ferroelectric materials.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Low-dimensional ferroelectric materials are those that exhibit ferroelectric properties at two-dimensional or quasi-two-dimensional scales. Ferroelectricity refers to the ability of a material to spontaneously polarize without the application of an external electric field; this polarization can be reversed with the application of an external field. These materials, which have fast read\/write speeds, low power consumption, and ultra-thin integration characteristics, are expected to play a significant role in future brain-like computing systems, pushing the development of artificial intelligence.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">At that time, the 2020 cohort of Ph.D. students had just arrived, so Zheng had to wait until 2021 to recruit students. In the meantime, he hired a research assistant, Mengqi Wu, a recent graduate from the Chinese Academy of Sciences who had delayed her overseas studies due to the pandemic and was looking for a transitional job. She was somewhat indifferent to everything—after all, she planned to go abroad eventually.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\"><br\/><\/p><p style=\"text-align: center\"><img src=\".\/W020250108626347199266.jpg\" data-uploadpic=\"U020250108623176214511.jpg\" needdownload=\"true\" data-needdownload=\"true\" title=\"微信图片_20241217134303.jpg\" alt=\"\" style=\"width: 500px;\" picname=\"微信图片_20241217134303.jpg\" OLDSRC=\"W020250108626347199266.jpg\" \/><br\/><span style=\"color: rgb(127, 127, 127); font-family: Aptos, sans-serif; font-size: 14px;\">Mengqi<\/span><span style=\"color: rgb(127, 127, 127); font-family: Aptos, sans-serif; font-size: 14px;\"> Wu<\/span><\/p><p style=\"text-align: center\"><span style=\"color: rgb(127, 127, 127);font-family: Aptos, sans-serif;font-size: 14px;text-wrap-mode: wrap\"><br\/><\/span><\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Wu, who had a background in biomaterials, had to start from scratch to learn about the properties and characterization of low-dimensional ferroelectric materials, a field entirely different from her previous studies.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Prof. Lin’s research is more theoretical, focusing on the novel properties of two-dimensional materials and phase transition control. Prof. Li’s work mainly involves advanced semiconductor materials and the study of electron-phonon interactions, electrical transport properties, and phase control in complex electronic materials. Zheng’s research focuses on scanning probe techniques and their applications, making it ideal for controlling and characterizing the physical properties of two-dimensional materials. As a result, Wu became a bridge between the three research groups, using a piezoresponse force microscope (PFM) to apply a force to the Bi<sub>2<\/sub>O<sub>2<\/sub>Se thin film and observe whether this force could induce a ferroelectric phase transition.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Though it sounds simple, the process was complicated and intricate.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Wu, initially indifferent to everything, became deeply engrossed in the project. A year later, she decided against going abroad, instead passing the admissions process at the School of Engineering to become Zheng’s first Ph.D. student at Westlake University.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">From a postdoctoral researcher to an independent scientist, Zheng now needed to consider a more systematic and complete approach. “Westlake University helps you grow quickly,” he says.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">But growth is never instant.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">“There’s always inertia at the beginning.”<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Zheng’s undergraduate studies were at Wuhan University, where he majored in electronic science and technology and physics. After graduating, he was admitted to the Institute of Physics at the Chinese Academy of Sciences for his master’s degree in condensed matter physics. Later, he pursued a Ph.D. at the Centre for Micro-photonics, Swinburne University of Technology in Australia, under Prof. Baohua Jia and Prof. Min Gu, researching laser fabrication of low-dimensional nano-photonic devices. Low-dimensional nano-photonic devices became his focus during his postdoctoral research at institutions such as the University of California, San Diego, the New York Academy of Sciences, and New York University.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">During his postdoctoral research, Zheng collaborated with Prof. Elisa Riedo at New York University on the development of commercial scanning probe nanofabrication systems. Using this technology, he created micro-nano electronic devices such as a single-atom-layer semiconductor diode with an optimal rectification ratio (<em>Nat. Commun<\/em>. 11, 3463, 2020) and a single-atom-layer field-effect transistor with an optimal switching ratio (<em>Nat. Electron<\/em>. 2, 17, 2019).<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\"><br\/><\/p><p style=\"text-align: center\"><img src=\".\/W020250108626347353765.jpg\" data-uploadpic=\"U020250108623562614678.jpg\" needdownload=\"true\" data-needdownload=\"true\" title=\"微信图片_20250108135335.jpg\" alt=\"\" style=\"width: 500px;\" picname=\"微信图片_20250108135335.jpg\" OLDSRC=\"W020250108626347353765.jpg\" \/><br\/><span style=\"color: rgb(127, 127, 127); font-family: Aptos, sans-serif; font-size: 14px;\">Haoting<\/span><span style=\"color: rgb(127, 127, 127); font-family: Aptos, sans-serif; font-size: 14px;\"> Ying<\/span><\/p><p style=\"text-align: center\"><span style=\"color: rgb(127, 127, 127);font-family: Aptos, sans-serif;font-size: 14px;text-wrap-mode: wrap\"><br\/><\/span><\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Haoting Ying, a member of the 2021 cohort, was the first Ph.D. student Zheng recruited. The first task he assigned to Ying was similar to his own postdoctoral research—creating a field-effect transistor using a similar method but with a different material.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Reproducing previous work should have been easy.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">It took Ying six months to complete the task. However, when he suggested publishing the work at a group meeting, his mentor rejected the idea.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">“Why can’t I publish this work, even though it’s the same as what you did during your postdoc?” Ying asked.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Zheng explained, “The new material you used is a special bipolar material that can significantly enhance transistor performance. The materials I used during my postdoc didn’t have this property. Your work can’t just be about changing the material. Besides, you have the potential to go further, so why not?”<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">People are often resistant to change and afraid of challenges.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">After the meeting, Ying found his mentor to explain that the approach was not feasible. Most of the time, Zheng would sit down with him to discuss potential solutions, offer advice, and encourage him to “give it a try.”<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">&quot;Give it a try&quot; was also the encouragement Zheng received from his mentors during his own Ph.D. studies.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Ying Haoting, using a thermal scanning probe system to pattern devices.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">“The biggest transformation for Ying during this process was that he went from being someone who was unwilling to try to someone who was willing to try and, ultimately, to someone who could try things on his own,” Zheng says. By the end of the second phase of work, many key breakthroughs were made by Ying on his own.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Now, could they publish?<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">This time, both mentor and student had reached a mutual understanding—it still wasn’t enough.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">With the PN junction in place, many things could be done. “It’s like having the building blocks for basic logic operations—seven different ones, like seven different Lego shapes. Is it possible to use one transistor to perform all seven operations?” Zheng often thinks outside the box, aiming for an all-in-one solution.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">“Ying’s first task was to replicate what I had done; his second task was something I knew could be done but hadn’t done myself, so I asked him to try; by the third task, I wasn’t sure if it could be done, but I felt it was challenging and meaningful, so we tried together.”<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Once Ying completed these three stages, publishing the paper was a natural outcome—a “by-product.”<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">In September 2023, their paper on a bipolar transistor that performed seven basic logic operations using tellurium homojunction materials and non-invasive scanning probe lithography was published in the journal <em>Device<\/em> (<em>Device<\/em> 1, 100069, 2023). This research holds significant implications for future brain-like computing and miniaturized computing devices.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">This wasn’t Ying’s only gain from this work. He also earned recognition as the lab’s most improved student, and became an example to encourage others.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Mengqi Wu, Haoting Ying, Zishun Li were all part of the 2021 doctoral student cohort. While two students published papers on unique technologies, Li struggled with his own project for a while. However, by the spring of 2023, he had a breakthrough.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">One day, after a group meeting, Li had a flash of inspiration about memristors. He suggested to Zheng that they could “build” lightning rods inside memristors to control discharge directions.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">“Good idea, let’s give it a try!” Zheng responded.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\"><br\/><\/p><p style=\"text-align: center\"><img src=\".\/W020250108626347704153.jpg\" data-uploadpic=\"U020250108624646088136.jpg\" needdownload=\"true\" data-needdownload=\"true\" title=\"微信图片_20241217111908.jpg\" alt=\"\" style=\"width: 500px;\" picname=\"微信图片_20241217111908.jpg\" OLDSRC=\"W020250108626347704153.jpg\" \/><br\/><span style=\"color: rgb(127, 127, 127); font-family: Aptos, sans-serif; font-size: 14px;\">Zishun<\/span><span style=\"color: rgb(127, 127, 127); font-family: Aptos, sans-serif; font-size: 14px;\"> Li<\/span><\/p><p style=\"text-align: center\"><span style=\"color: rgb(127, 127, 127);font-family: Aptos, sans-serif;font-size: 14px;text-wrap-mode: wrap\"><br\/><\/span><\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Li’s innovative approach, combining his background in material science with memristor research, led to a novel solution using thermal probe technology to create nanostructures in silk fibroin membranes. This breakthrough significantly improved the stability and switching speed of the devices, leading to a paper published in <em>Advanced Materials <\/em>(<em>Adv. Mater.<\/em> 36, 2308843, 2024).<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">The journey began under an umbrella at Yunqi Campus and continues forward, with new research emerging from the collaborative efforts of Zheng’s team.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">Recently, the collaboration with Prof. Xiao Lin from the Department of Physics has also yielded exciting results. Their new research into advanced ferroelectric materials for quantum memory devices is on the verge of publication.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">For Zheng, the most satisfying aspect of mentoring is not just the academic achievements of his students but also the sense of shared growth and the nurturing of independent scientific inquiry.<\/p><p style=\"margin: 0 0 11px;line-height: 18.4px;font-size: 16px;font-family: Aptos, sans-serif;text-wrap: wrap\">In his words, &quot;As a mentor, you’re not only teaching but also learning and growing with your students. That’s the real reward.&quot;<\/p><p style=\"text-align: center\"><img src=\".\/W020250108626347980162.jpg\" data-uploadpic=\"U020250108624932134853.jpg\" needdownload=\"true\" data-needdownload=\"true\" title=\"微信图片_20241217111914.jpg\" alt=\"\" style=\"width: 500px;\" picname=\"微信图片_20241217111914.jpg\" OLDSRC=\"W020250108626347980162.jpg\" \/><br\/><span style=\"font-size: 14px; color: rgb(127, 127, 127); font-family: Aptos, sans-serif;\">Prof.<\/span><span style=\"font-size: 14px; color: rgb(127, 127, 127); font-family: Aptos, sans-serif;\"> Xiaorui<\/span><span style=\"font-size: 14px; color: rgb(127, 127, 127); font-family: Aptos, sans-serif;\"> Zheng&#39;s<\/span><span style=\"font-size: 14px; color: rgb(127, 127, 127); font-family: Aptos, sans-serif;\"> group<\/span><\/p><p><br\/><\/p><\/div>",
