      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p><span style=\"font-family: arial, helvetica, sans-serif;font-size: 16px;\">Dr. Xiaorui Zheng received his Bachelor’s degree in Physics Base Class from Wuhan University, China in 2009, and had been recommended to Institute of Physics, Chinese Academy of Sciences, where he received his Master’s degree in Condensed Matter Physics. Dr. Zheng joined Centre for Micro-Photonics at Swinburne University of Technology, Australia to pursue his Ph.D. under the supervision of Professor Baohua Jia and Professor Min Gu, where he received his Ph.D. in 2016. Dr. Zheng’s Ph.D. research focused on the laser fabrication of low-dimensional photonic nanodevices, for which he was awarded “Chinese Government Award for Outstanding Self-Financed Students Abroad”. In 2016, Dr. Zheng was appointed as a postdoc research fellow at University of California, San Diego, USA under the support of Australian Nanotechnology Network Fellowship Scheme, where his research was on low-dimensional optoelectronics. In 2017, Dr. Zheng was sponsored by SwissLitho Industrial Research Fellowship to continue his postdoc research on scanning probe lithography for low-dimensional nanoelectronics at City University of New York and New York University, USA. Dr. Zheng joined Westlake University in 2020 as an Assistant Professor and started Alien Lab (Advanced Lithography for opto-Electronic Nanochips Lab).<\/span><\/p><\/div>",

      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"line-height: 1.75em;white-space: normal;margin-bottom: 0px;text-align: justify\"><span style=\"font-family: arial, helvetica, sans-serif;font-size: 16px\">Alien Lab develops advanced nanofabrication technology to explore the optical and electrical properties of novel nanomaterials and their optoelectronic devices for the applications in smart nanochips, ultrafast optical communication, infrared detection, high resolution medical imaging, rapid molecular detection, etc. Based on the guidance of National STEM Strategy, Alien Lab commits to fundamental science, applied research and student training, aiming at making its own contributions to the development of science and technology. The research directions include: 1) Scanning Probe Lithography; 2) Ultrafast Laser 3D Printing; 3) Atomistic Defects Engineering of Novel Nanomaterials; 4) Low-dimensional Optoelectronic Nanochips.<\/span><\/p><p style=\"line-height: 1.75em; white-space: normal; margin-bottom: 0px;\"><span style=\"font-family: arial, helvetica, sans-serif;font-size: 16px\">We are recruiting highly motivated students with strong research interests to pursue Ph.D. degree in the areas of nanoelectronics, nanofabrication, photonics and opto-electronics.<\/span><\/p><\/div>",
