      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"text-align: justify;\">Prof.Min Qiu is the Guoqiang Chair Professor of Optical Engineering and Vice President at Westlake University, where he also serves as the Dean of School of Engineering and the Director of Westlake Institute for Optoelectronics. He is a Foreign Member of Academia Europaea, a Foreign Member of European Academy of Sciences and Arts and a recipient of the National Science Fund for Distinguished Young Scholars. He is also a Fellow of several prestigious professional societies, including:IEEE Fellow (Institute of Electrical and Electronics Engineers)，Optica Fellow(formerly OSA, The Optical Society of America)，SPIE Fellow (International Society for Optical Engineering)，COS Fellow(Chinese Optical Society)，CSOE Fellow (Chinese Society of Optical Engineering) and CIE Fellow(Chinese Institute of Electronics). Prof. Qiu actively contributes to the academic community through leadership roles, serving as a Standing Council Member of the Chinese Society of Optical Engineering (CSOE), Deputy Director of both the Micro- and Nano-Optics Committees of CSOE and the Chinese Optical Society (COS), as well as Vice President of the Zhejiang Optical Society and the Zhejiang Institute of Electronics.<\/p><p style=\"text-align: justify;\">He received his Bachelor of Science and his Ph.D. in Condensed Matter Physics from Zhejiang University in 1995 and 1999, respectively. He then earned a Ph.D. in Electromagnetic Theory from the Royal Institute of Technology (KTH) in Sweden in 2001. He was appointed as Assistant Professor at KTH in the same year, promoted to Associate Professor in 2005, and became a full professor in photonics in 2009. His research has been supported by prestigious grants, including the &quot;Future Research Leader&quot; program from the Swedish Foundation for Strategic Research and the Senior Researcher Specialized Grant from the Swedish Research Council. In 2010, he joined the College of Optical Science and Engineering at Zhejiang University, where he also served as the Director of the State Key Laboratory of Modern Optical Instrumentation. In 2018, he joined Westlake University.<\/p><p><br\/><\/p><\/div>",

      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>Professor Min Qiu&#39;s laboratory focuses on micro- and nano- optoelectronics, encompassing advanced fabrication technologies and instrumentations, functional optical and optoelectronic devices, and nanophotonic technologies and theories for intelligent applications. In 2017 and 2020, he served as the project leader for the National Key R&amp;D Program of China and the National Major Scientific Instrument Development Project, respectively. He was honored with the First Prize of the 2021 Zhejiang Provincial  Natural Science Award. He currently serves as the Editor-in-Chief for <em>PhotoniX<\/em> (Springer Nature), the Associate Editor for <em>Science Bulletin<\/em> (Science China Press), the Associate Editor of <em>Acta Photonica Sinica<\/em>, and the Topical Editor for <em>Light: Science &amp; Applications<\/em> (Nature Publishing Group).<\/p><\/div>",
