      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p><span style=\"font-family: Arial, sans-serif;\">Yizhou Zhu obtained her B.S. degree in Physics (2011) and M.S. degree in Nuclear Technology (2014) both from Peking University. She earned her Ph.D. degree in Materials Science and Engineering at the University of Maryland, College Park in 2018. She worked as a postdoctoral research associate at Northwestern University from 2018 to 2021. Zhu joined the Westlake University as a tenure-track Assistant Professor since September 2021.<\/span><\/p><\/div>",

      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>Our computational materials science group focus on understanding, discovering, designing, and engineering inorganic solid materials through computational approaches. Traditional material research often relies heavily on empirical intuition and extensive trial and error, which results in long development cycles and high costs that cannot meet the rapid social and industrial demand for high performance materials. By integrating artificial intelligence algorithms with diverse computational tools, our group aims to establish fundamental understandings of the core structure property relationships at the microscopic atomic scale. Through high throughput computing and data mining, they discover and design novel materials that meet practical application requirements.<\/p><p><br\/><\/p><p>Our group has published academic papers Nature, Nature Communications, Science Advances, Angewandte Chemie International Edition, Joule, and Journal of Materials Chemistry A. Several of these publications are recognized as Web of Science Highly Cited Papers.<\/p><p><br\/><\/p><p>Current Research Interests:<\/p><p>-AI assisted automated characterization and analysis tools (AI plus Materials)<\/p><p>-Fundamental understanding and rational design of solid state synthesis<\/p><p>-Development and application of specialized machine learning force fields for solid state electrolytes<\/p><p><br\/><\/p><div><div><p style=\"line-height: 19.2px; white-space: normal; margin-top: 8px;\"><span style=\"font-size: 16px;line-height: 19.2px;font-family: Arial, sans-serif\">Opening: Our group currently have open positions for PhD students, postdoctoral scholars, and research associates. We welcome students with backgrounds of physics, materials science, computer science, chemical engineering, or any related field to join us. Interested candidates are welcome to send CV to zhuyizhou@westlake.edu.cn<\/span><\/p><\/div><\/div><\/div>",
