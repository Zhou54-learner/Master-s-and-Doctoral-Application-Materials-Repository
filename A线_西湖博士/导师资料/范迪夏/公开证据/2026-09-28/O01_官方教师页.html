      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"text-wrap: wrap;text-align: justify\">Dr. Dixia Fan was born in Shanghai in 1990. He obtained his BS.c. from Shanghai Jiao Tong University, China, in 2013, and then received his MS.c and Ph.D. from MIT, the USA, in 2016 and 2019. He then worked as a postdoctorate associate and then a research scientist at MIT Sea Grant, where he established the intelligent hydrodynamics lab. In 2021, he joined Queen’s University, Canada as an assistant professor in the department of mechanical and material engineering. In 2022, he joined Westlake University as an assistant professor in charge of the <a name=\"OLE_LINK21\"><\/a><a name=\"OLE_LINK22\">Intelligent and Informational Fluid Mechanics Laboratory<\/a>.<\/p><p><br\/><\/p><\/div>",

      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"text-wrap: wrap;text-align: justify\">Dr. Dixia Fan focuses his research on the fundamental understanding of fluid-structure interaction phenomena, bio-inspired amphibious robots design as well as AI application in vortical flow control and sensing. Based on physics-informed (and -informative) machine learning, He has been combining domain expertise (fluid mechanics, robotics, and control) and proper machine learning tools to address the inherent spatial and temporal non-linearity and multiscality of fluid-related problems at a greater scale and a broader scope. His work has been published in several esteemed Journals, include Science Robotics, Proceedings of National Academy of Science, Journal of Fluid Mechanics and etc.<\/p><p> <\/p><p style=\"text-wrap: wrap;text-align: justify\">At Intelligent and Informational Fluid Mechanics Laboratory, We envision a research paradigm shift in fluid mechanics to a physics-informed (and -informative) probabilistic learning framework, which leads to disruptive technology transform in the aerospace and marine industry to a more efficient, safe, and eco-friendly future. Some of the current research topics include 1) study of aerodynamics and hydrodynamics of fish, birds, insects, mammals locomotion, 2) development of novel programmable metamaterial for aero\/hydro morphing structures and 3) advancement of machine learning and bio-inspired algorithm for vortical flow control and sensing. <\/p><p style=\"text-wrap: wrap;text-align: justify\"><br\/><\/p><p style=\"text-wrap: wrap;text-align: justify\"><strong>Research directions:<\/strong><\/p><ol class=\" list-paddingleft-2\" style=\"width: 738.148px;text-wrap: wrap\"><li style=\"list-style-position: inside;text-align: justify\"><p style=\"text-indent: 0em;display: inline\">AI in Fluid Mechanics<\/p><\/li><li style=\"list-style-position: inside;text-align: justify\"><p style=\"text-indent: 0em;display: inline\">Vortical Flow Control and Sensing<br\/><\/p><\/li><li style=\"list-style-position: inside;text-align: justify\"><p style=\"text-indent: 0em;display: inline\">Bioinspired Robotics<\/p><\/li><li style=\"list-style-position: inside;text-align: justify\"><p style=\"text-indent: 0em;display: inline\">Metamaterial for Aero\/Hydro Morphing Structure<\/p><\/li><li style=\"list-style-position: inside;text-align: justify\"><p style=\"text-indent: 0em;display: inline\">Autonomy for Amphibious (Aerial \/ Aquatic) Swarms<\/p><\/li><li style=\"list-style-position: inside;\"><p style=\"display: inline;\"><br\/><\/p><\/li><\/ol><p><br\/><\/p><\/div>",

imental Summer Camp for Hands-on Thinkers in Shanghai. In 2020 IEEE Global Engineering Education Conference (EDUCON) (pp. 133-138). IEEE. <\/p><p style=\"text-wrap: wrap;text-align: justify\">8. Fan, D.*, Jodin, G., Consi, T.R., Bonfiglio, L., Ma, Y., Keyes, L.R., Karniadakis, G.E.* and Triantafyllou, M.S.*, 2019. A robotic intelligent towing tank for learning complex fluid-structure dynamics. Science Robotics, 4(36), p.eaay5063.<\/p><p style=\"text-wrap: wrap;text-align: justify\">9. Fan, D., Wang, Z.*, Triantafyllou, M.S. and Karniadakis, G.E., 2019. Mapping the properties of the vortex-induced vibrations of flexible cylinders in uniform oncoming flow. Journal of Fluid Mechanics, 881, pp.815-858.<\/p><p style=\"text-wrap: wrap;text-align: justify\">10. Fan, D.*, Wu, B., Bachina, D. and Triantafyllou, M.S., 2019. Vortex-induced vibration of a piggyback pipeline half buried in the seabed. Journal of Sound and Vibration, 449, pp.182-195.<\/p><p> <\/p><p><br\/><\/p><\/div>",
