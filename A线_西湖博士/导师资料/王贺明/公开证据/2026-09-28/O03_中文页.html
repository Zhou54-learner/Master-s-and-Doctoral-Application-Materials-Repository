      biographyTitle: "个人简介",
      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p><span style=\"font-size: 16px;text-indent: 32px;text-wrap-mode: wrap;font-family: 微软雅黑\">王贺明，辽宁大连人。2012年获第13届亚洲物理奥林匹克竞赛（APhO）金牌。2016年本科毕业于北京大学物理学院并获理学学士学位，2021年于加利福尼亚理工学院应用物理系取得博士学位（师从Kerry Vahala教授）。之后先后于加利福尼亚理工学院（Kerry Vahala课题组）、加州大学圣巴巴拉分校（John Bowers课题组）、斯坦福大学（Shanhui Fan课题组）从事博士后研究。2025年全职加入西湖大学，担任<\/span><span style=\"font-size: 16px;text-indent: 32px;text-wrap-mode: wrap;font-family: 微软雅黑\">特聘研究员、助理教授，<\/span><span style=\"font-size: 16px;text-indent: 32px;text-wrap-mode: wrap;font-family: 微软雅黑\">负责<\/span><span style=\"font-size: 16px;text-indent: 32px;text-wrap-mode: wrap;font-family: 微软雅黑\">非厄米动力学与器件实验室。<\/span><\/p><\/div>",

      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>2025<\/p><p>助理教授, 西湖大学<\/p><p><br\/><\/p><p>2023<\/p><p>博士后, 斯坦福大学<\/p><p><br\/><\/p><p>2022<\/p><p>博士后，加利福尼亚大学圣巴巴拉分校<\/p><p><br\/><\/p><p>2021<\/p><p>博士后，加利福尼亚理工学院<\/p><p>博士，加利福尼亚理工学院<\/p><p><br\/><\/p><p>2016<\/p><p>学士，北京大学<\/p><p><br\/><\/p><p>2012<\/p><p>第13届亚洲物理奥林匹克竞赛（APhO）金牌<\/p><\/div>",
      researchTitle: "学术成果及研究方向", //标题文案抛出
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"line-height: 28px;font-size: 16px;text-wrap-mode: wrap;text-align: justify;margin-top: 7px;margin-bottom: 0px;font-family: 宋体;text-indent: 32px\"><span style=\"font-family: 微软雅黑\">能量守恒是现代物理学大厦的支柱，但现实生活中很难找到能量完全守恒的例子。秋千的摇摆会因为摩擦而最终停止，各类电器在电能用尽之后就需要插入电源充电。当损失能量和获得能量的过程同时发生时，就可以引发异常奇妙的现象，而这正是非厄米物理研究的内容。<\/span><\/p><p style=\"line-height: 28px;font-size: 16px;text-wrap-mode: wrap;margin-top: 7px;margin-bottom: 7px;font-family: 宋体;text-indent: 32px\"><span style=\"font-family: 微软雅黑\">王贺明博士基于理论、仿真、实验、微纳加工的研究经验，对各类非厄米光学系统进行了严谨细致的分析，代表性成果包括：（1）提出一维周期性结构的边态在不受对称性保护时仍然具有拓扑稳定性，给出了计算拓扑不变量的具体公式并推广至非厄米系统；（2）<\/span><span style=\"font-family: 微软雅黑\">提出<\/span><span style=\"font-family: 微软雅黑\">并实验验证使用<\/span><span style=\"font-family: 微软雅黑\">Petermann<\/span><span style=\"font-family: 微软雅黑\">系数解释奇异点传感器在奇异点附近的噪声，打破了奇异点领域内只考虑本征值噪声而忽略本征矢量贡献的固有观念，同时澄清了关于奇异点附近噪声行为的争议；（3）提出移除孤子生成系统中的激光隔离器并使其形成激光<\/span><span style=\"font-family: 微软雅黑\">—<\/span><span style=\"font-family: 微软雅黑\">微腔自注入锁定系统，揭示光孤子的自发形成机理，使得孤子的生成由随机性事件变为确定性事件；（4）<\/span><span style=\"font-family: 微软雅黑\">提出使用耦合横模和其形成的等效色散替代单一横模和材料固有色散，类比相对论量子场论中的狄拉克孤子，解析求解了耦合模式中的孤子脉冲形式，使得正常色散材料中脉冲孤子产生成为可能。<\/span><\/p><p style=\"line-height: 28px;font-size: 16px;text-wrap-mode: wrap;margin-top: 7px;margin-bottom: 7px;font-family: 宋体;text-indent: 32px\"><span style=\"font-family: 微软雅黑\">王贺明博士<\/span><span style=\"font-family: 微软雅黑\">负责的<\/span><span style=\"font-family: 微软雅黑\">非厄米动力学与器件实验室将基于光学、电学、声学、机械结构等具体体系，继续深入探讨能量损失和增加带来的物理效应，进行跨学科的基础和应用研究，实现新型高灵敏度传感器和其他潜在应用。研究方向包括但不限于：<\/span><\/p><p style=\"line-height: 28px;font-size: 16px;text-wrap-mode: wrap;margin-top: 7px;margin-bottom: 7px;font-family: 宋体;text-indent: 32px\"><span style=\"font-family: 微软雅黑\">(1) 传感器的噪声特性和性能极限；<\/span><\/p><p style=\"line-height: 28px;font-size: 16px;text-wrap-mode: wrap;margin-top: 7px;margin-bottom: 7px;font-family: 宋体;text-indent: 32px\"><span style=\"font-family: 微软雅黑\">(2) 奇异点及其几何性质；<\/span><\/p><p style=\"line-height: 28px;font-size: 16px;text-wrap-mode: wrap;margin-top: 7px;margin-bottom: 7px;font-family: 宋体;text-indent: 32px\"><span style=\"font-family: 微软雅黑\">(3) 非厄米能带结构及其拓扑性质；<\/span><\/p><p style=\"line-height: 28px;font-size: 16px;text-wrap-mode: wrap;margin-top: 7px;margin-bottom: 7px;font-family: 宋体;text-indent: 32px\"><span style=\"font-family: 微软雅黑\">(4) 非厄米系统的基本原理和数学形式。<\/span><\/p><p><br\/><\/p><\/div>",
