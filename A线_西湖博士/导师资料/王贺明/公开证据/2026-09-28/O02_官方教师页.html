      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"text-align: justify; margin-top: 0px; margin-bottom: 0px; font-family: 宋体; font-size: 16px; text-wrap-mode: wrap; line-height: 28px;\"><span style=\"color: rgb(12, 12, 12);\"><span style=\"font-size: 16px; background: rgb(255, 255, 255); font-family: Helvetica;\">Heming Wang<\/span><span style=\"font-family: Helvetica; font-size: 16px; background: rgb(255, 255, 255);\"> was born in <\/span><span style=\"font-size: 16px; background: rgb(255, 255, 255); font-family: Helvetica;\">Dalian<\/span><span style=\"font-family: Helvetica; font-size: 16px; background: rgb(255, 255, 255);\">, <\/span><span style=\"font-size: 16px; background: rgb(255, 255, 255); font-family: Helvetica;\">Liaoning<\/span><span style=\"font-family: Helvetica; font-size: 16px; background: rgb(255, 255, 255);\"> Province. <\/span><span style=\"font-size: 16px; background: rgb(255, 255, 255); font-family: Helvetica;\">He is a gold medalist at the 13th Asian Physics Olympiad (APhO), 2012. He received a bachelor<\/span><span style=\"font-size: 16px; background: rgb(255, 255, 255); font-family: Helvetica;\">’<\/span><span style=\"font-size: 16px; background: rgb(255, 255, 255); font-family: Helvetica;\">s degree from School of Physics, Peking University in 2016 and a PhD degree from Applied Physics option, California Institute of Technology (Caltech) in 2021. After that, he has been a postdoctoral scholar at Caltech, University of California, Santa Barbara (UCSB) and Stanford University. He has joined Westlake University in 2025 as an Assistant Professor and the PI of the <\/span><span style=\"font-family: Helvetica; font-size: 16px; background: rgb(255, 255, 255);\">Non-Hermitian Dynamics and Devices Laboratory<\/span><span style=\"font-size: 16px; background: rgb(255, 255, 255); font-family: Helvetica;\">.<\/span><\/span><\/p><\/div>",
      // 年份和事件必须独立包裹在p标签内，且不可以有多余的p标签
      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>2025<\/p><p>Assistant Professor, Westlake University<\/p><p><br\/><\/p><p>2023<\/p><p>Postdoctoral researcher, Stanford<\/p><p><br\/><\/p><p>2022<\/p><p>Postdoctoral researcher, UCSB<\/p><p><br\/><\/p><p>2021<\/p><p>Postdoctoral researcher, Caltech<\/p><p>Ph.D. degree, Caltech<\/p><p><br\/><\/p><p>2016<\/p><p>Bachelor’s degree, Peking University<\/p><p><br\/><\/p><p>2012<\/p><p>Gold medalist, 13th Asian Physics Olympiad (APhO)<\/p><\/div>",
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"text-align: justify; margin-top: 7px; margin-bottom: 0px; font-family: 宋体; text-wrap-mode: wrap; line-height: 28px; font-size: 15px;\"><span style=\"font-family: Helvetica;color: rgb(51, 51, 51);font-size: 15px\">The law of conserved energy is the foundation of modern physics. However, it is extremely difficult to find a system in real life that conserves its energy. The motion of a swing eventually comes to a stop due to friction, and electric appliances need to be recharged when their stored electric energies run out. The synergy between losing and gaining energy in these systems leads to mind-boggling properties, which is the central topic of non-Hermitian physics.<\/span><\/p><p style=\"text-align: justify; margin-top: 7px; margin-bottom: 0px; font-family: 宋体; text-wrap-mode: wrap; line-height: 28px; font-size: 15px;\"><br\/><\/p><p style=\"text-align: justify; margin-top: 7px; margin-bottom: 0px; font-family: 宋体; text-wrap-mode: wrap; line-height: 28px; font-size: 15px;\"><span style=\"font-family: Helvetica;color: rgb(51, 51, 51);font-size: 15px\">Based on research experiences in theory, simulation, experiment and nanofabrication, Heming has performed detailed and rigorous analysis on various non-Hermitian optical systems. Representative achievements include: 1, proposed the topological stability of edge states in one-dimensional periodic systems without symmetry protections, provided explicit formula for the associated topological invariants and generalized to non-Hermitian systems; 2, proposed and experimentally verified the equivalence of excess noise in exceptional-point sensors and the Petermann factor in laser physics, breaking the assumption that eigenvector variation does not contribute to noise properties and clarifying the longstanding problem of noise properties near the exceptional point in the literature; 3, formulated the dependency of laser frequency on intracavity power in laser-microcavity self-injection-locked systems with isolators removed, and explained the spontaneous formation of solitons that converts the random process of soliton generation into a deterministic process; 4, analytically determined and experimentally realized the soliton waveforms in coupled modes by providing a correspondence to Dirac equations in quantum field theories, which makes it possible to generate conventional soliton pulses in materials with normal dispersions.<\/span><\/p><p style=\"text-align: justify; margin-top: 7px; margin-bottom: 7px; font-family: 宋体; text-wrap-mode: wrap; line-height: 28px; font-size: 15px;\"><br\/><\/p><p style=\"margin-top: 7px; margin-bottom: 7px; font-family: 宋体; text-wrap-mode: wrap; font-size: 15px;\"><span style=\"font-family: Helvetica;color: rgb(51, 51, 51);font-size: 15px\">The Non-Hermitian Dynamics and Devices Laboratory will continue to focus on physical effects related to the energy gains and losses, conducting inderdisciplinary fundamental and applied research based on photonic, electronic, acoustic and mechanical systems. High-performance sensors and other potential applications will also be realized. Research directions include but are not limited to:<\/span><\/p><p style=\"margin-top: 7px; margin-bottom: 7px; font-family: 宋体; text-wrap-mode: wrap; font-size: 15px;\"><br\/><\/p><p style=\"margin-top: 7px; margin-bottom: 7px; font-family: 宋体; text-wrap-mode: wrap; margin-left: 48px; text-indent: -24px; font-size: 15px;\"><span style=\"font-family: Helvetica;color: rgb(51, 51, 51);font-size: 15px\">· Noise<\/span><span style=\"font-family: Helvetica;color: rgb(51, 51, 51);font-size: 15px\"><\/span><span style=\"font-family: Helvetica;color: rgb(51, 51, 51);font-size: 15px\"> properties and performance limitations of sensors;<\/span><\/p><p style=\"margin-top: 7px; margin-bottom: 7px; font-family: 宋体; text-wrap-mode: wrap; margin-left: 48px; text-indent: -24px; font-size: 15px;\"><span style=\"font-family: Helvetica;color: rgb(51, 51, 51);font-size: 15px\">· Exceptional points and their geometric properties;<\/span><\/p><p style=\"margin-top: 7px; margin-bottom: 7px; font-family: 宋体; text-wrap-mode: wrap; margin-left: 48px; text-indent: -24px; font-size: 15px;\"><span style=\"font-family: Helvetica;color: rgb(51, 51, 51);font-size: 15px\">· Non-Hermitian band structures and their topological properties;<\/span><\/p><p style=\"margin-top: 7px; margin-bottom: 7px; font-family: 宋体; text-wrap-mode: wrap; margin-left: 48px; text-indent: -24px; font-size: 15px;\"><span style=\"font-family: Helvetica;color: rgb(51, 51, 51);font-size: 15px\">· Basic principles and mathematical foundations of non-Hermitian systems.<\/span><\/p><p><br\/><\/p><\/div>",
