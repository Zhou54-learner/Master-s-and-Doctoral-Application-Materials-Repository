      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p><span style=\"font-size: 14px;font-family: Arial, sans-serif\">Jingyi Tian was born in Huai’an, Jiangsu, in 1991. She received her Bachelor&#39;s degree in Information Engineering (also Honors Degree of the Chu Kochen Honors College) from Zhejiang University in 2014. She later received her PhD degree in Optical Engineering from Zhejiang University and subsequently joined the School of Physical and Mathematical Sciences at Nanyang Technological University in Singapore as a research fellow in 2019. She has become an Assistant Professor in the School of Engineering at Westlake University since 2024. Her doctoral thesis was nominated for Outstanding Doctor Dissertations in Optics by the Chinese Optical Society and was also recognized as an Outstanding Doctor Dissertation by Zhejiang University. She was honored with Women in Engineering, Science and Technology Conference Grant by Nanyang Technological University in 2020. In 2024, she was recognized as Rising Stars in Optics by IOPscience.<\/span><\/p><\/div>",
      // 年份和事件必须独立包裹在p标签内，且不可以有多余的p标签
      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>2024<\/p><p>Assistant Professor, School of Engineering, Westlake University<\/p><p>2020<\/p><p>Women in Engineering, Science and Technology Conference Grant by Nanyang Technological University<\/p><p>2019<\/p><p>Research Fellow, Nanyang Technological University<\/p><p>PhD degree, Zhejiang University <\/p><p>2014<\/p><p>Bachelor&#39;s degree (Honors Degree of the Chu Kochen Honors College), Zhejiang University<\/p><\/div>",
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"text-align:justify;text-justify:inter-ideograph;line-height:28px\"><span style=\"font-family: Arial, sans-serif\">Conventional optical components like lenses and polarizers still have limitations when it comes to optical manipulation. The use of these tools hinders the achievement of complex and precise optical control within a confined spatial and temporal range, which doesn&#39;t meet the demands of device miniaturization. On the other hand, optical metamaterials\/nanostructures, comprising subwavelength resonant cavities, offer a solution. These structures can generate virtual optical states with specific energy (spectral) and momentum (spatial) distributions, effectively enhancing the density of local states. Consequently, they provide powerful means for optical control at nanoscale.<\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph;line-height:28px\"><span style=\"font-family: Arial, sans-serif\">Dr. Jingyi Tian has dedicated herself to the theory and technology of optical manipulation, spanning from macroscopic rough manipulation to microscopic versatile control, by employing nanostructures and metamaterials. She initiated the concept and realized a phase-change perovskite microlaser with tunable polarization vortexes; She also developed a robust one-dimensional ultrathin topological laser operating in the visible spectral range; Moreover, by utilizing micro\/nanostructures to manipulate the disordered fluorescence emission from achiral perovskites, she broke the record of degree of circular polarization in the well-defined directional radiation. As the first\/corresponding author, she has published many papers in top journals such as Nature Communications, Advanced Materials, Nano Letters, and Laser &amp; Photonics Reviews, etc. In 2024, she was recognized by Stanford University and Elsevier as one of the top 2% of scientists worldwide.<\/span><\/p><p><span style=\"font-size: 14px;font-family: Arial, sans-serif\">The research group focuses on addressing the theoretical and technological bottlenecks in generating and manipulating light at the micro\/nanoscale. By grasping cutting-edge physical concepts, such as topological photonics, and utilizing advanced materials such as phase-change materials, halide perovskite materials, and two-dimensional materials, etc., in combination with advanced processing techniques, they aim to further develop practical micro\/nanoscale electrooptical meta-devices. Specifically, their research objectives encompass two main areas: (1) Developing (ultrafast) multifunctional and tunable micro\/nanodevices. (2) Designing high-performance and robust micro\/nanoscale functional light sources and photodtectors. The successful achievement of these objectives will facilitate further development of optical displays, optical storage, energy harvesting, and optical communications.<\/span><\/p><\/div>",
