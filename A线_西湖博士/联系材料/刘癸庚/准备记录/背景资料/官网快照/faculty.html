      biographyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"margin: 0px; text-align: justify; line-height: 28px;\"><span style=\"font-family:&#39;Arial&#39;,sans-serif;color:black\">Gui-Geng Liu completed his undergraduate studies in the Poling Class of Physics at Nankai University in 2017 and obtained his Ph.D. degree from the School of Physical and Mathematical Sciences at Nanyang Technological University in 2023. After completing his Ph.D., he continued his postdoctoral research at Nanyang Technological University. In 2024, he joined Westlake University full-time as an Assistant Professor (independent PI, doctoral supervisor) in the School of Engineering, and received funding from the National Overseas High-level Talent Youth Program. Dr. Liu has been awarded the Top-Grade Award of National Undergraduate Innovation and Entrepreneurship Training Program in 2017, the Outstanding Undergraduate Thesis in Tianjin in 2017, the Chinese Government Outstanding Self-Financed Student Scholarship in 2021, one of the Top 10 Optical Events with Social Influence in China in 2022, the Gold Medal of Material Research Society of Singapore in Physics in 2023, and the sole Winner of Graduate College Research Excellence Award of Nanyang Technological University in 2023, the Finalist Award of Rising Stars of Light in 2024, and 2024 Forbes China 30 Under 30.<\/span><\/p><\/div>",
      // 年份和事件必须独立包裹在p标签内，且不可以有多余的p标签
      historyStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p>2024<\/p><p>Assistant Professor, School of Engineering, Westlake University<\/p><p>2023<\/p><p>Ph.D. degree, Nanyang Technological University<\/p><p>Postdoctoral researcher, Nanyang Technological University<\/p><p>2022<\/p><p>One of the Top 10 Optical Events with Social Influence in China<\/p><p>2021<\/p><p>The Chinese Government Outstanding Self-Financed Student Scholarship<\/p><p>2017<\/p><p>B.S. degree, Nankai University<\/p><p>Outstanding Undergraduate Thesis<\/p><\/div>",
      researchStr: "<div class=\"view TRS_UEDITOR trs_paper_default trs_web\"><p style=\"text-align:justify;text-justify:inter-ideograph;line-height:150%\"><span style=\"font-family: 宋体;font-size: 16px\"><span style=\"font-family:Arial\">The Liu Guigeng Laboratory at Westlake University is dedicated to fundamental and applied research in related fields such as topological photonics, non-Hermitian optics, terahertz optics, spatially structured light fields, photonic crystals, and metamaterials. It aims to explore novel physics across multiple optical scales (covering low-frequency circuits, microwaves, terahertz, infrared, and visible light) and, based on this, develop optical devices with novel functionalities, emphasizing a research path that equally values breakthroughs in mechanism, device realization, and practical application. The laboratory&#39;s primary research directions include, but are not limited to:<\/span><\/span><\/p><p style=\"text-align:justify;text-justify:inter-ideograph;line-height:150%\"><span style=\"font-family: 宋体;font-size: 16px\"><span style=\"font-family:Arial\">(1) Topological states of matter and topological photonic\/optoelectronic devices: Based on experimental platforms such as photonic crystals, metamaterials, on-chip microcavities, and circuits, we study the fundamental mechanisms of novel topological states and develop topological photonic\/optoelectronic devices with new control mechanisms.<\/span><\/span><\/p><p style=\"text-align:justify;text-justify:inter-ideograph;line-height:150%\"><span style=\"font-family: 宋体;font-size: 16px\"><span style=\"font-family:Arial\">(2) Non-Hermitian physics and non-Hermitian optical devices: Utilizing systems like optical microcavities, non-Hermitian circuits, superconducting devices, and metamaterials, we investigate exotic physical effects (e.g., exceptional points, bound states in the continuum) in open non-Hermitian systems and promote their applications in areas such as sensing and communications.<\/span><\/span><\/p><p style=\"text-align:justify;text-justify:inter-ideograph;line-height:150%\"><span style=\"font-family: 宋体;font-size: 16px\"><span style=\"font-family:Arial\">(3) Terahertz chips and 6G communication technology: Based on systems like photonic crystals and metasurfaces, we develop novel terahertz photonic chips to achieve dynamic control of terahertz waves and promote their application in 6G communication scenarios.<\/span><\/span><\/p><p style=\"text-align:justify;text-justify:inter-ideograph;line-height:150%\"><span style=\"font-family: 宋体;font-size: 16px\"><span style=\"font-family:Arial\">(4) Spatially structured light fields: We advance techniques for the generation, manipulation, and characterization of new types of spatially structured light fields, including spatiotemporal vortex beams and vector beams.<\/span><\/span><\/p><p style=\"text-align:justify;margin-top:0;margin-bottom:0;text-justify:inter-ideograph;line-height:150%\"><span style=\"font-family: 宋体;font-size: 16px\"><span style=\"font-family:Arial\">(5) Research on other cutting-edge optical technologies: This includes exploration in interdisciplinary fields such as optical AI computing and advanced display technologies.<\/span><\/span><\/p><p style=\"text-align:justify;margin-top:0;margin-bottom:0;text-justify:inter-ideograph;line-height:150%\"><span style=\"font-family: Arial;font-size: 16px\"> <\/span><\/p><p style=\"text-align:justify;text-justify:inter-ideograph;line-height:150%\"><span style=\"font-family: 宋体;font-size: 16px\"><span style=\"font-family:Arial\">Prior research achievements have been published as first\/corresponding author in journals including Nature and Science. Introductions to several representative works are provided below:<\/span><\/span><\/p><p style=\"text-align:justify;margin-top:0;margin-bottom:0;margin-left:24px;text-indent:-24px;text-justify:inter-ideograph;line-height:150%\"><span style=\"font-family: Arial;font-size: 16px\">1. <\/span><span style=\"font-family: 宋体;font-size: 16px\"><span style=\"font-family:Arial\">Construction <\/span><span style=\"font-family:Arial\">of the first three-dimensional Chern insulator. The Chern insulator is one of the most fundamental and crucial topological states in the study of topological physics, and its experimental realization has always been a core issue. Previous studies had only achieved two-dimensional Chern insulators (such as the Quantum Anomalous Hall Effect), while three-dimensional Chern insulators had not been discovered. Dr. Liu and his collaborators used three-dimensional magnetic photonic crystals to successfully construct the first three-dimensional Chern insulator, advancing the study of Chern insulators into the three-dimensional realm. Furthermore, they extended the bulk-edge correspondence of Chern insulators, experimentally constructed a Chern vector to characterize the three-dimensional Chern insulator, and discovered complex topological surface waves such as knots and links. (Gui-Geng Liu, et al. Nature 609, 925 (2022))<\/span><\/span><\/p><p style=\"text-align:justify;margin-top:0;margin-bottom:0;margin-left:24px;text-indent:-24px;text-justify:inter-ideograph;line-height:150%\"><span style=\"font-family: Arial;font-size: 16px\">2. <\/span><span style=\"font-family: 宋体;font-size: 16px\"><span style=\"font-family:Arial\">Construction of the first photonic axion insulator. Axions are theoretically predicted as potential components of dark matter, described by axion fields. Although axions have not yet been directly observed experimentally, they can manifest as quasiparticles in crystals. Dr. Liu and his collaborators simulated the axion field in photonic crystals, achieving the first photonic axion insulator and observing topological surface states characterized by a half-integer Chern number as well as chiral edge states generated by the axion field. (Gui-Geng Liu, et al. Science 387, 162 (2025))<\/span><\/span><\/p><p style=\"margin-left:24px;text-indent:-24px;line-height:150%\"><span style=\"font-family: Arial;font-size: 16px\">3. <\/span><span style=\"font-family: &#39;Times New Roman&#39;;line-height: 150%;font-size: 16px\"><span style=\"font-family:Arial\">Comprehensive study of non-Hermitian localized states, band degeneracies, disorder-induced topological properties, and antichiral boundary states in non-reciprocal photonic systems. <\/span><\/span><span style=\"font-family: 宋体;line-height: 150%;font-size: 16px\"><span style=\"font-family:Arial\">(Phys. Rev. Lett. 132, 113802 (2024); Phys. Rev. Lett. 129, 125502 (2022); Phys. Rev. Lett. 125, 133603 (2020); Phys. Rev. Lett. 125, 263603 (2020); Nat. Commun. 14, 1991 (2023); Nat. Commun. 11, 1873 (2020); Natl. Sci. Rev. 11, nwae121 (2024); Sci. Bull. 69, 2050 (2024); Light Sci. Appl. 9, 133 (2020))<\/span><\/span><\/p><p style=\"font-size: 16px;\"><br\/><\/p><p style=\"font-size: 16px;\"><span style=\"font-size: 16px; font-family: Arial;\"><\/span><\/p><p style=\"font-size: 16px;\"><span style=\"font-size: 16px; font-family: Arial;\">In addition <\/span><span style=\"font-size: 16px; font-family: Arial;\">to the above-mentioned work, Dr. Liu has made contributions in the fields of topological acoustics, non-Hermitian physics, structured optical fields, and liquid crystal metamaterials.<\/span><\/p><p><br\/><\/p><\/div>",
