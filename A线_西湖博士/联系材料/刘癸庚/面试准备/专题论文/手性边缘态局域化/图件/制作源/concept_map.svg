<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <title>Two topological roles in loss-controlled chiral edge localization</title>
  <desc>Interpretive reading map of Liu et al., PRL 132, 113802 (2024). Chern topology supplies chiral edge channels. Structured loss and chirality produce complex spectral winding in the studied strips, which corresponds to side or corner localization in finite samples. Uniform scalar loss is a counterexample to loss alone implying skin localization.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#36536b" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#182c3b">
    <text x="40" y="47" font-size="27" font-weight="bold">Loss controls where chiral edge states concentrate</text>
    <text x="40" y="77" font-size="16" fill="#52616b">INTERPRETATION • Reading map of Liu et al., PRL 132, 113802 (2024), Figs. 2–4</text>
    <rect x="40" y="112" width="340" height="142" rx="12" fill="#eaf2f8" stroke="#2a6386" stroke-width="2"/>
    <text x="62" y="143" font-size="19" font-weight="bold">Chern topology</text>
    <text x="62" y="174" font-size="17">Gyromagnetic bias + bulk line gaps</text>
    <text x="62" y="202" font-size="17">Gap labels: C₂ = −1, C₃ = +1</text>
    <text x="62" y="230" font-size="17">Chiral boundary channels persist</text>
    <rect x="40" y="294" width="340" height="142" rx="12" fill="#eaf2f8" stroke="#2a6386" stroke-width="2"/>
    <text x="62" y="325" font-size="19" font-weight="bold">Structured loss + chirality</text>
    <text x="62" y="356" font-size="17">Opposite edges sample different loss</text>
    <text x="62" y="384" font-size="17">Complex frequencies f(k)</text>
    <text x="62" y="412" font-size="17">Loss alone is not sufficient</text>
    <rect x="433" y="294" width="315" height="142" rx="12" fill="#e9f5f2" stroke="#247967" stroke-width="2"/>
    <text x="455" y="325" font-size="19" font-weight="bold">Point-gap winding</text>
    <text x="455" y="356" font-size="17">Trace f(k) around a reference f₀</text>
    <text x="455" y="384" font-size="17">One strip direction: νₓ ≠ 0</text>
    <text x="455" y="412" font-size="17">Redesign: νₓ ≠ 0 and νᵧ ≠ 0</text>
    <rect x="820" y="182" width="340" height="220" rx="12" fill="#e9f5f2" stroke="#247967" stroke-width="2"/>
    <text x="842" y="216" font-size="19" font-weight="bold">Finite-sample skin localization</text>
    <text x="842" y="251" font-size="17">Fig. 2: right / left edge</text>
    <text x="842" y="281" font-size="17">Fig. 4: upper-right / lower-left</text>
    <text x="842" y="321" font-size="17">Chiral edge states concentrate</text>
    <text x="842" y="351" font-size="17">on part of the sample boundary</text>
    <text x="842" y="382" font-size="16" fill="#52616b">Hybrid labels: (C, νₓ, νᵧ)</text>
    <g fill="none" stroke="#36536b" stroke-width="2.2" marker-end="url(#arrow)">
      <path d="M380,183 H785 V225 H817"/>
      <path d="M210,255 V291"/>
      <path d="M381,365 H430"/>
      <path d="M749,365 H817"/>
    </g>
    <text x="476" y="164" font-size="16" fill="#36536b">Supplies the edge channels</text>
    <text x="776" y="339" font-size="14" text-anchor="middle" fill="#36536b">OBC</text>
    <rect x="40" y="479" width="1120" height="158" rx="12" fill="#f5f6f7" stroke="#c3cbd0"/>
    <text x="62" y="509" font-size="18" font-weight="bold">Three checks before interpreting a bright spot</text>
    <text x="62" y="542" font-size="17">BACKGROUND: Uniform scalar loss H₀ + iγI shifts eigenvalues but leaves eigenvectors unchanged.</text>
    <text x="62" y="575" font-size="17">PAPER-SUPPORTED: Here OBC means lattice truncation with copper boundaries, not radiation absorption.</text>
    <text x="62" y="608" font-size="17">EVIDENCE LIMIT: Calculated eigenmodes and measured driven fields are related, distinct objects.</text>
    <text x="40" y="673" font-size="15" fill="#52616b">Conceptual diagram, not simulated data. Supplementary Material pending. Chinese explanations: 02_Physics_Concept_Map.md</text>
  </g>
</svg>
