        detailContent: "<div class=\"view TRS_UEDITOR trs_paper_default trs_word\"><p style=\"text-align: justify; line-height: 37px; background: white;\"><a name=\"OLE_LINK1\"><\/a><\/p><p style=\"text-indent: 40px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black;background:white\">西湖大学采取<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black;background:white\">“<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black;background:white\">申请<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black;background:white\">-<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black;background:white\">考核<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black;background:white\">”<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black;background:white\">方式招收博士研究生，热忱欢迎有志青年前来西湖大学攻读博士学位研究生！<\/span><\/p><p style=\"text-indent: 28px; line-height: 37px; background: white; text-align: justify;\"><a href=\"https:\/\/www.westlake.edu.cn\/admissions\/graduate\/brochure\/recommended\/202608\/t20260803_68690.html\"><span style=\"font-size:20px;font-family:仿宋_GB2312;background:white\">西湖大学<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;background:white\">2027<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;background:white\">年接收推荐免试直博生报名通知<\/span><\/a><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black;background:white\">已经发布，欢迎全国各高校具有<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black;background:white\">2027<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black;background:white\">年推荐免试资格的优秀应届本科生申请。现开放普博生申请通道，欢迎优秀应往届本科生、硕士毕业生申请西湖大学<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black;background:white\">2027<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black;background:white\">年博士生。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">一、招生专业及招生人数<\/span><\/strong><\/p><p style=\"text-indent: 40px; line-height: 37px; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">2027<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312\">年，西湖大学将在<strong>数学（和复旦大学联培）、<a name=\"OLE_LINK9\">物理学、化学、生物学、材料科学与工程、电子科学与技术<\/a><\/strong><\/span><strong><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">6<\/span><\/strong><strong><span style=\"font-size:20px;font-family: 仿宋_GB2312\">个一级学科以及智能信息技术、定量生物学与复杂系统、可持续发展科学与技术、多尺度天体物理、生物医学<\/span><\/strong><span style=\"font-size:20px;font-family:仿宋_GB2312\">等<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">5<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312\">个目录外二级（交叉）招收博士研究生。<\/span><\/p><p style=\"text-indent: 40px; line-height: 37px; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312\">西湖大学<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">2026<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312\">年共录取博士研究生<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">729<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312\">人（其中西湖大学<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">-<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312\">深圳医学科学院联培项目录取<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">180<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312\">人），供参考，学校<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">2027<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312\">年具体招生人数将以教育部下达的最终招生计划为准。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">二、学习方式和学制<\/span><\/strong><\/p><p style=\"text-indent: 40px; line-height: 37px; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312\">西湖大学仅招收全日制学术学位博士研究生，录取类别为非定向，入学前须将人事档案转入学校。<\/span><\/p><p style=\"text-indent: 40px; line-height: 37px; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312\">应届硕士生或已获硕士学位申请者攻读博士学位研究生，学制<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">4<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312\">年；应届本科生或已获学士学位申请者攻读博士学位研究生，学制<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">5<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312\">年。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">三、申请基本条件<\/span><\/strong><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">（一）中华人民共和国公民；拥护中国共产党的领导，具有正确的政治方向，热爱祖国，愿意为社会主义现代化建设服务，遵纪守法，品行端正。<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">（二）具有浓厚的学术研究兴趣，有较强的创新意识、创新能力和专业能力。<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">（三）学业水平须符合下列条件之一：<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">1.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">应届硕士毕业生（最迟须在入学前毕业或取得硕士学位）；硕士研究生毕业或已获硕士学位的人员。<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">2.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">应届本科毕业生（最迟须在入学前取得学历学位）或已获学士学位人员，可申请西湖大学独立招生学科（<\/span><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">物理学、化学、生物学、材料科学与工程、电子科学与技术、智能信息技术、定量生物学与复杂系统、可持续发展科学与技术、多尺度天体物理、生物医学<\/span><\/strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">）。<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">国（境）外院校中国籍优秀本科毕业生可申请西湖大学<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">-<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">复旦大学联合培养项目数学学科的普博生，其就读本科学校排名须同时入围<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">2027<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">年<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">QS,USNEWS,THE,ARWU<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">主流世界大学排行榜前<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">100<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">名，且在读期间平均学分绩点（<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">GPA<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">）不低于<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">3.5\/4.0<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">。<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">（四）英语水平优秀，需满足以下条件之一：<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">1.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">全国大学英语六级<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">≥460<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">（智能信息技术学科<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">≥480<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">）；<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">2.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">雅思成绩<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">≥6.0;<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">3.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">托福<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">120<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">分制<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">≥90<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">或托福<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">6<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">分制<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">≥4.5<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">。<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">4.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">在境外英语为母语国家或地区攻读并获得学位或攻读境外高校全英文授课学位项目并获得学位，最迟在入学前取得《国（境）外学历学位认证书》（不含中外合作办学项目兼得的境外高校学位）。<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">（五）<a name=\"_Hlk80020052\">在读博士研究生、硕士研究生（除<\/a><\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">2027<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">年应届硕士毕业生）、强基计划身份学生报名前须征得所在培养单位同意，须提交所在培养单位学校学籍管理部门出具的同意报考证明。<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">（六）至少由<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">2<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">位所报考学科专业领域内的教授（或相当专业技术职称的专家）或博士生导师的推荐。<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">（七）身心健康，符合国家和学校规定的体检要求。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">四、申请方式及流程<\/span><\/strong><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">（一）申请方式<\/span><\/strong><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">申请人须通过<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">“<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">西湖大学博士研究生申请系统<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">”<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">在线填写相关信息并提交材料。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">请根据系统页面提示注册账号，<\/span><strong><span style=\"font-size:20px;font-family: 仿宋_GB2312;color:red\">如实<\/span><\/strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">填写或选择个人相关信息。注册页面系统提示信息为中英双语，<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:red\">中国国籍申请人请输入中文<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">的姓和名，系统根据申请者选择的国籍区分中国学生还是国际生，请务必准备选择。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">申请系统网址：<\/span><a href=\"https:\/\/gradadmission.westlake.edu.cn\/\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">https:\/\/gradadmission.westlake.edu.cn\/<\/span><\/a><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">（二）申请时间<\/span><\/strong><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">即日起至<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">8<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">月<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">31<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">日上午<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">10:00<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">（北京时间），逾期不再接受申请。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">（三）申请材料<\/span><\/strong><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">请仔细阅读申请系统内的<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">“<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">须知<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">”<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">，在规定时间内如实提交以下材料：<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">1.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">个人陈述：主要涵盖本人学术科研经历及博士阶段研究计划，请登录申请系统内材料上传模块下载并使用<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">“<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">参考模板<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">”<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">。<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">关于书写语言：申请工学院的学科、理学院多尺度天体物理须用<\/span><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:#EE0000\">英文<\/span><\/strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">书写；意向导师为外籍<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">PI<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">，须用<\/span><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:#EE0000\">英文<\/span><\/strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">书写；其他情况中英文均可。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">2.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">高等教育阶段学历学位证书扫描件、学历（学籍）学位在线验证报告；应届毕业生提交所在培养单位的在读证明；在国（境）<span style=\"background:white\">外获得的学位提交教育部留学服务中心出具的《国（境）外学历学位认证书》。<\/span><\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">3.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">高等教育阶段（研究生须包含本科阶段）成绩单，应届本科生还需提交综合成绩排名（如有）。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">4.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">英语成绩证明：全国大学英语六级、托福或雅思等成绩证明。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">5.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">学术科研成果：体现自身学术水平的代表性学术科研成果。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">6.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">获奖证明：在校期间从事课外科技活动获奖证明或其他各类获奖证明。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">7.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">专家推荐信：至少有<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">2<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">封所在申请专业相关领域内的教授（或相当技术职称专家）或博士生导师出具的推荐信。强烈建议通过申请系统发出邀请邮件，推荐人通过邮件内的推荐信链接在线填写并提交。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black;background:white\">8.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black;background:white\">学院学科规定要求上传的其他材料。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">五、考核方式及主要流程<\/span><\/strong><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">申请提交之后，主要分为资格预审、材料初审、综合考核等环节，各环节审核结果在申请系统中发布。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">1.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">资格预审：主要检查材料是否齐全，初步审查是否符合报考条件。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">2.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">材料初审：学科专家小组就申请材料进行学术审核，根据初审成绩择优确定入围综合考核阶段的名单。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">3.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">综合考核：综合考核前，将进行资格复核，重点核验身份信息、学历学位信息等。申请者须按要求携带身份证、学历学位证书、成绩单、英语成绩证明等原件材料，供学院学科核验。经核验不符合规定的，取消资格。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">综合考核主要包含专业知识考核、外语能力考核、思想政治素质和品德考核等。学院按招生专业成立不少于<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">5<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">人的面试专家小组，考查申请人综合运用所学知识的能力、科研创新能力、对本学科前沿领域及最新研究动态掌握情况，结合申请材料进行综合考核评价，判断考生是否具备博士生培养的潜能和素质。面试考核主要包含个人汇报、专家提问、英语考核等环节，申请者需就个人学术背景及攻读博士阶段科研计划以<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">PPT<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">的方式进行汇报。除面试外，各学院学科可根据实际情况采取笔试、实验操作等形式对申请者进一步考察。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">4.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">公示与拟录取<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">按照<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">“<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">择优录取、保证质量、宁缺毋滥<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">”<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">的原则，结合综合考核成绩、身心健康状况、思想政治素质和品德考核结果等表现在招生计划内择优确定拟录取名单，经学校研究生招生工作领导小组审批后由学校进行公示。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">经公示无异议的拟录取学生需按要求完成体检、思想政治素质和品德考核等拟录取重要环节，体检结果须符合国家、学校相关要求和规定，体检或思想政治素质和品德考核结果不合格者，将被取消拟录取资格。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">拟录取名单须经过教育部录取审核，联培项目拟录取名单经联培院校审批后报教育部录取审核，审核通过后发放录取通知书。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">六、学费和奖助学金<\/span><\/strong><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">西湖大学博士研究生学费为<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">10000<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">元<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">\/<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">学年，按学制缴纳；西湖大学<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">-<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">复旦大学联培项目拟录取博士生学费按复旦大学规定缴纳。<\/span><\/p><p style=\"text-indent: 36px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">西湖大学目前已构建完善的博士研究生奖助体系，除了国家奖学金、学业奖学金、国家助学金等资助体系外，学校还专门设立了西湖大学助学金和社会奖助学金，让每一位博士研究生都能够专注学业、潜心科研。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">七、其他注意事项<\/span><\/strong><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">1.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">西湖大学<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">2027<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">年博士研究生招生简章及各院系招生简章将于近期发布，关于各学科定导模式等要求请查阅报考须知。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">2.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">西湖大学<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">-<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">复旦大学联培项目拟录取博士生，需按照联培学校要求完成信息采集等相关内容，后续另行通知。学生在联培院校注册学籍，顺利完成学业后，颁发联培院校毕业证书和学位证书。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">3.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">西湖大学招收全日制非定向博士研究生，按规定向拟录取博士研究生的存档单位调取人事档案。申请人与签约单位之间因合同产生的各类责任关系，由申请人本人与签约单位协商处理。<\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph;text-indent:40px;line-height:37px;background:white\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">4.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">信息查询：请关注西湖大学官网查阅相关信息，申请信息、申请结果等状态信息请登录申请系统查阅。<\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph;text-indent:40px;line-height:37px;background:white\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">5.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">申诉：申请人对院系<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">\/<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">学科招生环节有异议的，可向院系<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">\/<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">学科以书面形式具名提起申诉，院系<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">\/<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">学科应当受理并予以答复。申诉人对答复有异议的，可向研究生院提起申诉。<\/span><\/p><p style=\"margin:0;text-align:justify;text-justify:inter-ideograph;text-indent:40px;line-height:37px;background:white\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif;color:black\">6.<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">若有相关政策调整，学校将第一时间发布通知；未尽事宜，以教育部和西湖大学发布的最新要求为准。<\/span><\/p><p style=\"text-indent: 37px; line-height: 37px; background: white; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312;color:black\">八、联系方式<\/span><\/strong><\/p><p style=\"text-indent: 40px; line-height: 37px; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312\">学校地址：浙江省杭州市西湖区墩余路<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">600<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312\">号（云谷校区）<\/span>  <\/p><p style=\"text-indent: 140px; line-height: 37px; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312\">浙江省杭州市西湖区石龙山街<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">16<\/span><span style=\"font-size:20px;font-family:仿宋_GB2312\">号（云栖校区）<\/span><\/p><p style=\"text-indent: 40px; line-height: 37px; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312\">邮编：<\/span><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">310030<\/span><\/p><p style=\"text-indent: 40px; line-height: 37px; text-align: justify;\"><span style=\"font-size:20px;font-family:仿宋_GB2312\">西湖大学官网：<\/span><a href=\"http:\/\/www.westlake.edu.cn\/\"><span style=\"font-size:20px;font-family:&#39;Times New Roman&#39;,serif\">www.westlake.edu.cn<\/span><\/a><\/p><p style=\"text-indent: 40px; line-height: 37px; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312\">（一）招生咨询<\/span><\/strong><\/p><p style=\"text-indent: 40px; line-height: 37px; text-align: justify;\"><strong><span style=\"font-size:20px;font-family:仿宋_GB2312\">博士生招生页面：<\/span><\/strong><span
