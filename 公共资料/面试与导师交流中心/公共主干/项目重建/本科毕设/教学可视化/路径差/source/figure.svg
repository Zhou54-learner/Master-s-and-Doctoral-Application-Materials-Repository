<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="650" viewBox="0 0 1260 650" role="img" aria-labelledby="title desc"><title id="title">相邻单元到同一观察点：路程差怎样变化</title><desc id="desc">精确有限距离几何。A、B间距p，观察点P距中点O为3p，分别取与法线夹角0、45、80度。蓝线AP，橙线BP。路径差始终不超过p。</desc><rect width="1260" height="650" fill="#f4f7fb"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="32" y="45" font-size="28" fill="#253248" text-anchor="start">相邻单元到同一观察点：到底差了多少路？</text><text x="32" y="78" font-size="18" fill="#526078" text-anchor="start">蓝线 = AP    橙线 = BP    A、B 间距固定为 p；三图都取 OP = 3p，按同一比例绘制。</text><g id="panel-0" transform="translate(25,110)"><rect width="385" height="456" rx="16" fill="white" stroke="#dae2ed"/><text x="19" y="35" font-size="23" fill="#253248" text-anchor="start">① 正上方：0°</text><line x1="23" y1="285" x2="360" y2="285" stroke="#bac5d3" stroke-width="2"/><line x1="91" y1="285" x2="91" y2="65" stroke="#a9b5c5" stroke-width="1.5" stroke-dasharray="5 6"/><text x="20" y="90" font-size="15" fill="#758298" text-anchor="start">法线</text><line x1="54.5" y1="285" x2="91.0" y2="66.0" stroke="#2073c8" stroke-width="4"/><line x1="127.5" y1="285" x2="91.0" y2="66.0" stroke="#dd7830" stroke-width="4"/><circle cx="54.5" cy="285" r="6" fill="#2073c8"/><circle cx="127.5" cy="285" r="6" fill="#dd7830"/><circle cx="91.0" cy="66.0" r="7" fill="#8056c9"/><text x="45.5" y="312" font-size="19" fill="#2073c8" text-anchor="start">A</text><text x="129.5" y="312" font-size="19" fill="#dd7830" text-anchor="start">B</text><text x="91" y="312" font-size="15" fill="#758298" text-anchor="middle">O</text><text x="105.0" y="81.0" font-size="18" fill="#8056c9" text-anchor="start">观察点 P</text><line x1="54.5" y1="331" x2="127.5" y2="331" stroke="#67758a" stroke-width="2"/><line x1="54.5" y1="325" x2="54.5" y2="337" stroke="#67758a" stroke-width="2"/><line x1="127.5" y1="325" x2="127.5" y2="337" stroke="#67758a" stroke-width="2"/><text x="91" y="356" font-size="18" fill="#526078" text-anchor="middle">AB = p</text><text x="19" y="393" font-size="19" fill="#253248" text-anchor="start">AP = 3.041p    BP = 3.041p</text><text x="19" y="432" font-size="23" fill="#8056c9" text-anchor="start">路程差 = 0.000p</text></g><g id="panel-1" transform="translate(438,110)"><rect width="385" height="456" rx="16" fill="white" stroke="#dae2ed"/><text x="19" y="35" font-size="23" fill="#253248" text-anchor="start">② 斜上方：45°</text><line x1="23" y1="285" x2="360" y2="285" stroke="#bac5d3" stroke-width="2"/><line x1="91" y1="285" x2="91" y2="65" stroke="#a9b5c5" stroke-width="1.5" stroke-dasharray="5 6"/><text x="20" y="90" font-size="15" fill="#758298" text-anchor="start">法线</text><line x1="54.5" y1="285" x2="245.85638507985394" y2="130.14361492014606" stroke="#2073c8" stroke-width="4"/><line x1="127.5" y1="285" x2="245.85638507985394" y2="130.14361492014606" stroke="#dd7830" stroke-width="4"/><circle cx="54.5" cy="285" r="6" fill="#2073c8"/><circle cx="127.5" cy="285" r="6" fill="#dd7830"/><circle cx="245.85638507985394" cy="130.14361492014606" r="7" fill="#8056c9"/><text x="45.5" y="312" font-size="19" fill="#2073c8" text-anchor="start">A</text><text x="129.5" y="312" font-size="19" fill="#dd7830" text-anchor="start">B</text><text x="91" y="312" font-size="15" fill="#758298" text-anchor="middle">O</text><text x="235.85638507985394" y="115.14361492014606" font-size="18" fill="#8056c9" text-anchor="end">观察点 P</text><line x1="54.5" y1="331" x2="127.5" y2="331" stroke="#67758a" stroke-width="2"/><line x1="54.5" y1="325" x2="54.5" y2="337" stroke="#67758a" stroke-width="2"/><line x1="127.5" y1="325" x2="127.5" y2="337" stroke="#67758a" stroke-width="2"/><text x="91" y="356" font-size="18" fill="#526078" text-anchor="middle">AB = p</text><text x="19" y="393" font-size="19" fill="#253248" text-anchor="start">AP = 3.372p    BP = 2.670p</text><text x="19" y="432" font-size="23" fill="#8056c9" text-anchor="start">路程差 = 0.702p</text></g><g id="panel-2" transform="translate(851,110)"><rect width="385" height="456" rx="16" fill="white" stroke="#dae2ed"/><text x="19" y="35" font-size="23" fill="#253248" text-anchor="start">③ 接近沿表面：80°</text><line x1="23" y1="285" x2="360" y2="285" stroke="#bac5d3" stroke-width="2"/><line x1="91" y1="285" x2="91" y2="65" stroke="#a9b5c5" stroke-width="1.5" stroke-dasharray="5 6"/><text x="20" y="90" font-size="15" fill="#758298" text-anchor="start">法线</text><line x1="54.5" y1="285" x2="306.67289790967357" y2="246.97104909094224" stroke="#2073c8" stroke-width="4"/><line x1="127.5" y1="285" x2="306.67289790967357" y2="246.97104909094224" stroke="#dd7830" stroke-width="4"/><circle cx="54.5" cy="285" r="6" fill="#2073c8"/><circle cx="127.5" cy="285" r="6" fill="#dd7830"/><circle cx="306.67289790967357" cy="246.97104909094224" r="7" fill="#8056c9"/><text x="45.5" y="312" font-size="19" fill="#2073c8" text-anchor="start">A</text><text x="129.5" y="312" font-size="19" fill="#dd7830" text-anchor="start">B</text><text x="91" y="312" font-size="15" fill="#758298" text-anchor="middle">O</text><text x="296.67289790967357" y="231.97104909094224" font-size="18" fill="#8056c9" text-anchor="end">观察点 P</text><line x1="54.5" y1="331" x2="127.5" y2="331" stroke="#67758a" stroke-width="2"/><line x1="54.5" y1="325" x2="54.5" y2="337" stroke="#67758a" stroke-width="2"/><line x1="127.5" y1="325" x2="127.5" y2="337" stroke="#67758a" stroke-width="2"/><text x="91" y="356" font-size="18" fill="#526078" text-anchor="middle">AB = p</text><text x="19" y="393" font-size="19" fill="#253248" text-anchor="start">AP = 3.493p    BP = 2.509p</text><text x="19" y="432" font-size="23" fill="#8056c9" text-anchor="start">路程差 = 0.984p</text></g><text x="32" y="604" font-size="22" fill="#253248" text-anchor="start">为什么不会超过 p？直达 A→P，总不会比绕路 A→B→P 更长。</text><text x="32" y="635" font-size="19" fill="#526078" text-anchor="start">因此 AP ≤ p + BP，即 AP − BP ≤ p。交换 A、B，得到 |AP − BP| ≤ p。</text></g></svg>